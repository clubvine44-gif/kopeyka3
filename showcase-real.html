<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Kopeyka — recording</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.stage{width:100vw;height:100vh;display:flex;justify-content:center;align-items:stretch;background:#050608}.screen{position:relative;width:min(520px,100vw);height:100vh;overflow:hidden;background:#0A0B0E}iframe{display:block;width:100%;height:100%;border:0;background:#0A0B0E}.spot{position:absolute;z-index:9;pointer-events:none;border:2px solid rgba(229,167,94,.95);border-radius:16px;opacity:0;box-shadow:0 0 0 9999px rgba(0,0,0,.46),0 0 24px rgba(229,167,94,.85),inset 0 0 18px rgba(229,167,94,.12);transition:left 1100ms cubic-bezier(.16,1,.3,1),top 1100ms cubic-bezier(.16,1,.3,1),width 1100ms cubic-bezier(.16,1,.3,1),height 1100ms cubic-bezier(.16,1,.3,1),opacity 600ms ease}.spot.on{opacity:1}.fade{position:absolute;inset:0;z-index:10;background:#07080b;opacity:1;pointer-events:none;transition:opacity 1100ms ease}.fade.off{opacity:0}</style></head><body><main class="stage"><section class="screen"><iframe id="app" src="index.html?showcase=real"></iframe><div id="spot" class="spot"></div><div id="fade" class="fade"></div></section></main><script>const F=document.querySelector('#app'),S=document.querySelector('#spot'),D=document.querySelector('#fade');const wait=m=>new Promise(r=>setTimeout(r,m)),doc=()=>F.contentDocument,vis=e=>{if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return s.display!='none'&&s.visibility!='hidden'&&s.opacity!='0'&&r.width>2&&r.height>2},find=s=>{const d=doc();return d?[...d.querySelectorAll(s)].find(vis):null},all=s=>{const d=doc();return d?[...d.querySelectorAll(s)].filter(vis):[]};function move(e){const r=e.getBoundingClientRect(),f=F.getBoundingClientRect();S.style.left=r.left+f.left-6+'px';S.style.top=r.top+f.top-6+'px';S.style.width=r.width+12+'px';S.style.height=r.height+12+'px';S.classList.add('on')}async function show(e,t){if(!e)return;try{e.scrollIntoView({behavior:'smooth',block:'center'})}catch(_){}await wait(700);move(e);await wait(t);S.classList.remove('on');await wait(500)}async function play(){await wait(1000);D.classList.add('off');await wait(1100);await show(find('.topbar'),2200);await show(find('.hero'),4000);const fab=find('.fab');if(fab){await show(fab,1800);if(!fab.classList.contains('open'))fab.click();await wait(500);await show(find('.radial.show'),2600);if(fab.classList.contains('open'))fab.click()}await show(find('.cal'),4200);for(const e of all('.sec').slice(0,4)){if(!e.classList.contains('open'))e.querySelector('.sec-head')?.click();await wait(200);await show(e,2700)}await show(find('.finn-avatar'),3200);const d=doc(),nav=d&&[...d.querySelectorAll('*')].filter(vis).filter(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return (s.position=='fixed'||s.position=='sticky')&&r.bottom>=d.documentElement.clientHeight-12&&r.width>d.documentElement.clientWidth*.55&&r.height>40}).sort((a,b)=>b.getBoundingClientRect().width-a.getBoundingClientRect().width)[0];await show(nav,3500);S.classList.remove('on');D.classList.remove('off')}F.addEventListener('load',()=>setTimeout(play,500))</script></body></html>
