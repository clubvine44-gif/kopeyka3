<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0F1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Копейка</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
[hidden]{display:none!important}
:root{
  --bg:#0F1014; --surface:#171922; --surface2:#1E212B; --border:#2A2E3C;
  --text:#F4F3EE; --dim:#8E8E9C; --safe:#3DD68C; --danger:#F0665F; --warn:#E8B84A;
  --brand:#E5A75E; --brand2:#B5652F; --brand-glow:rgba(229,167,94,.36);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius:18px; --fab:58px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);min-height:100%}
body{padding-bottom:calc(96px + var(--safe-bottom))}
.topbar{
  position:sticky; top:0; z-index:40;
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:6px;
  padding:12px 16px; background:rgba(15,16,20,.9); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.brand{
  display:flex; align-items:center; gap:8px; justify-self:start;
  background:none; border:0; color:var(--text); font-weight:700; font-size:16px; cursor:pointer;
}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 12px var(--brand-glow)}
.top-actions{display:flex; align-items:center; gap:6px; justify-self:end}
.topbar-notice{
  justify-self:center; display:flex; align-items:center; gap:6px;
  max-width:100%; padding:6px 12px; border-radius:999px;
  background:linear-gradient(135deg, rgba(229,167,94,.18), rgba(61,214,140,.1));
  border:1px solid rgba(229,167,94,.28);
  font-size:12px; font-weight:600; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  opacity:0; transform:translateY(-4px) scale(.96);
  transition:opacity .25s ease, transform .25s ease;
  pointer-events:none;
}
.topbar-notice.show{opacity:1; transform:translateY(0) scale(1)}
.topbar-notice .tn-dot{width:6px;height:6px;border-radius:50%;background:var(--safe);flex:none;box-shadow:0 0 6px var(--safe)}
.topbar-notice .tn-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:14px 16px 24px; max-width:560px; margin:0 auto}
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px; margin-bottom:12px;
}
.card.hero{
  background:
    radial-gradient(120% 140% at 100% 0%, rgba(229,167,94,.12), transparent 55%),
    linear-gradient(165deg, #1A1C26, #14161E);
}
.card.hero .big{margin:6px 0 2px}
.label{font-size:12px;color:var(--dim);margin-bottom:4px}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.mid{font-size:22px;font-weight:700}
.faint{font-size:12px;color:var(--dim);margin-top:4px}
.pos{color:var(--safe)} .neg{color:var(--danger)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid2 .card{margin-bottom:0}
.cash-card{
  background:
    radial-gradient(140% 160% at 0% 0%, rgba(229,167,94,.08), transparent 55%),
    linear-gradient(165deg, #1A1C26, #15171F);
}
.cash-card .label{margin-bottom:12px}
.cash-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.cash-col{min-width:0}
.cash-col.right{text-align:right}
.cash-col .mid{font-size:22px;font-weight:800;letter-spacing:-.02em}
.cash-divider{height:1px;background:var(--border);margin:0 0 10px}
.cash-rows .row{padding:5px 0}
.section{font-size:13px;font-weight:700;color:var(--dim);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:600;font-size:14px;cursor:pointer}
.btn-primary{background:linear-gradient(145deg,var(--brand),var(--brand2));color:#291605;width:100%;box-shadow:0 8px 22px var(--brand-glow)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);width:100%}
.btn-ghost{background:transparent;color:var(--dim);border:0;padding:8px 0;width:100%}
.btn-danger{background:rgba(240,102,95,.14);color:var(--danger);border:1px solid rgba(240,102,95,.28);width:100%}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.field input,.field select,textarea{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); font-size:15px;
}
.field.modern label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.field.modern input,.field.modern select,.field.modern textarea{
  border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);
  padding:14px 16px;font-size:16px;transition:border-color .2s,background .2s,box-shadow .2s;
}
.field.modern input:focus,.field.modern select:focus,.field.modern textarea:focus{
  outline:none;border-color:rgba(229,167,94,.5);background:rgba(229,167,94,.07);box-shadow:0 0 0 3px rgba(229,167,94,.14);
}
.field.modern select{
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%238E8E9C' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:38px;
}
.field.modern input[type="number"]::-webkit-outer-spin-button,
.field.modern input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field.modern input[type="date"]{color-scheme:dark}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head{font-size:11px;color:var(--dim);text-align:center;padding:4px}
.cal-day{
  aspect-ratio:1;border-radius:12px;border:1px solid transparent;
  background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.cal-day.off{opacity:.5}
.cal-day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px rgba(229,167,94,.25)}
.cal-day .dot{width:6px;height:6px;border-radius:50%}
.cal-day .dot.day{background:#5B8CFF}
.cal-day .dot.night{background:#A78BFA}
.cal-day .dot.off{background:#555}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.item:last-child{border-bottom:0}
.item .ico{font-size:20px;width:28px;text-align:center}
.item .meta{flex:1;min-width:0}
.item .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--dim)}
.item .amt{font-weight:700;white-space:nowrap}
.fab{
  position:fixed;left:50%;bottom:calc(18px + var(--safe-bottom));transform:translateX(-50%);
  width:var(--fab);height:var(--fab);border-radius:50%;border:0;
  background:linear-gradient(150deg,#F0C384,var(--brand) 42%,var(--brand2));
  color:#291605;font-size:28px;font-weight:300;line-height:1;cursor:pointer;z-index:100;
  box-shadow:0 10px 28px var(--brand-glow),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.22);
  transition:transform .22s cubic-bezier(.22,.9,.28,1),background .22s;
}
.fab.open{transform:translateX(-50%) rotate(45deg);background:linear-gradient(150deg,#524C5C,#332F3B);color:#F2F1EC;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.nav-backdrop{position:fixed;inset:0;z-index:80;background:rgba(6,8,14,.62);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .28s}
.nav-backdrop.show{opacity:1;pointer-events:auto}
.nav-arc{position:fixed;left:50%;bottom:calc(18px + var(--safe-bottom) + 20px);width:0;height:0;z-index:90;pointer-events:none}
.nav-arc.show{pointer-events:auto}
.nav-arc:not(.show){visibility:hidden;opacity:0}
.nav-btn{
  position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;
  border-radius:50%;border:1px solid rgba(229,167,94,.16);
  background:radial-gradient(120% 130% at 30% 22%, rgba(255,255,255,.09), transparent 45%),linear-gradient(160deg,#2A2634,#1B1720);
  color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  opacity:0;transform:translate3d(0,0,0) scale(.35);
  transition:transform .32s cubic-bezier(.22,1,.32,1),opacity .26s ease;
  box-shadow:0 10px 26px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.09);
  padding:0;
}
.nav-arc.show .nav-btn{opacity:1}
.nav-btn .nav-ico{font-size:21px;line-height:1}
.nav-btn .lbl{font-size:9px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn.active{border-color:rgba(229,167,94,.55);box-shadow:0 0 0 2px rgba(229,167,94,.2),0 10px 26px rgba(0,0,0,.42)}
.nav-btn.add{background:linear-gradient(150deg,#F0C384,var(--brand) 42%,var(--brand2));color:#291605;border:0;box-shadow:0 10px 26px var(--brand-glow)}
.nav-btn.add .lbl{color:rgba(41,22,5,.7)}
.modal-wrap{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-wrap{align-items:center}}
.modal{
  background:var(--surface);width:100%;max-width:480px;max-height:88vh;overflow:auto;
  border-radius:22px 22px 0 0;padding:20px 20px calc(24px + var(--safe-bottom));
}
@media(min-width:640px){.modal{border-radius:22px}}
.modal h2{margin:0 0 16px;font-size:18px}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}
.toast{
  position:fixed;left:50%;bottom:calc(90px + var(--safe-bottom));transform:translateX(-50%);
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:12px 16px;border-radius:12px;z-index:200;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100vw - 32px);
}
.period-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.period-nav button{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);cursor:pointer;font-size:18px;
}
.empty{text-align:center;padding:32px 16px;color:var(--dim)}
.empty .emoji{font-size:36px;margin-bottom:8px}
.cloud-account{position:relative;margin-left:4px}
.cloud-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;padding:0;
}
.cloud-dot{position:absolute;right:2px;bottom:2px;width:10px;height:10px;border-radius:50%;background:#555;border:2px solid var(--surface)}
.cloud-dot.on{background:var(--brand)}
.cloud-menu{
  position:absolute;right:0;top:48px;width:260px;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:12px;z-index:200;box-shadow:0 16px 40px rgba(0,0,0,.45);
}
.cloud-email{font-weight:600;margin-bottom:4px;word-break:break-all}
.cloud-status{font-size:12px;color:var(--dim);margin-bottom:10px}
.cloud-status.ok{color:var(--safe)}
.cloud-menu .btn{margin-bottom:6px}
.cloud-auth{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.cloud-auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:380px;position:relative}
.cloud-auth-msg{font-size:13px;color:var(--warn);min-height:20px;margin-bottom:8px}
.analytics-card{padding:16px;position:relative;z-index:1}
.an-title{font-size:13px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
.an-donut-wrap{display:flex;align-items:center;gap:16px}
.an-donut{width:110px;height:110px;border-radius:50%;flex:none;position:relative}
.an-donut-hole{position:absolute;inset:22px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.an-donut-hole .an-sum{font-size:13px;font-weight:800}
.an-donut-hole .an-sub{font-size:10px;color:var(--dim)}
.an-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.an-leg-row{display:flex;align-items:center;gap:8px}
.an-swatch{width:10px;height:10px;border-radius:3px;flex:none}
.an-leg-name{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-leg-val{font-size:12px;font-weight:700;white-space:nowrap}
.an-bars{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.an-bar-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:4px}
.an-bar-track{height:8px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.an-bar-fill{height:100%;border-radius:99px;min-width:2px}
.an-empty{font-size:13px;color:var(--dim);text-align:center;padding:12px 0}
.reserve-cat-grid{display:grid;gap:8px;margin-bottom:12px}
.reserve-cat-btn{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;font-size:14px}
.reserve-cat-btn.active{border-color:rgba(229,167,94,.45);background:rgba(229,167,94,.1);box-shadow:0 0 0 2px rgba(229,167,94,.12)}
.reserve-cat-btn .rc-sub{display:block;font-size:11px;color:var(--dim);margin-top:2px}
@media(min-width:900px){
  .fab{left:auto;right:28px;transform:none}
  .fab.open{transform:rotate(45deg)}
  .nav-arc{left:auto;right:56px}
}
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" id="brandHome" type="button"><span class="dot"></span> Копейка</button>
  <div class="topbar-notice" id="topNotice" hidden><span class="tn-dot"></span><span class="tn-text"></span></div>
  <div class="top-actions"></div>
</header>
<main id="main"></main>
<button type="button" class="fab" id="fab" aria-label="Меню">+</button>
<div class="nav-backdrop" id="navBackdrop"></div>
<div class="nav-arc" id="navArc"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js?v=1"></script>
<script src="cloud.js?v=1"></script>
</body>
</html>
