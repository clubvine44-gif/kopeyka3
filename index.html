<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0E0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Копейка</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0E0F14;--card:#161822;--card2:#1C1F2A;--line:#2A2E3C;
  --tx:#F3F2ED;--mute:#8B8C9A;--ok:#3DD68C;--bad:#FF6B66;--warn:#E8B84A;
  --brand:#E5A75E;--brand2:#C47A3A;--glow:rgba(229,167,94,.35);
  --safe:env(safe-area-inset-bottom,0px);--r:18px;--fab:60px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);min-height:100%}
body{padding-bottom:calc(96px + var(--safe))}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:12px 16px;background:rgba(14,15,20,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;background:0;border:0;color:var(--tx);
  font-weight:700;font-size:16px;cursor:pointer}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 12px var(--glow)}
.top-sp{flex:1}
.top-act{display:flex;gap:6px;align-items:center}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);color:var(--tx);cursor:pointer;font-size:15px}

main{padding:14px 16px 20px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(229,167,94,.12),transparent 50%),
  linear-gradient(165deg,#1A1C26,#14161E)}
.lbl{font-size:12px;color:var(--mute);margin-bottom:4px;letter-spacing:.02em}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0}
.mid{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sm{font-size:12px;color:var(--mute);margin-top:4px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.row b{font-weight:700;white-space:nowrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g2 .card{margin:0}
.navm{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.navm strong{font-size:15px}
.navm button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
  background:var(--card2);color:var(--tx);cursor:pointer;font-size:18px}

.cash .topr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.cash .div{height:1px;background:var(--line);margin:8px 0 10px}
.sec{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;
  letter-spacing:.06em;margin:18px 0 8px}

.an-wrap{display:flex;gap:14px;align-items:center}
.donut{width:100px;height:100px;border-radius:50%;flex:none;position:relative}
.hole{position:absolute;inset:20px;border-radius:50%;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hole .s{font-size:12px;font-weight:800}.hole .t{font-size:9px;color:var(--mute)}
.leg{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.leg-r{display:flex;align-items:center;gap:7px;font-size:12px}
.sw{width:9px;height:9px;border-radius:3px;flex:none}
.leg-n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg-v{font-weight:700;white-space:nowrap}
.bars{margin-top:12px}.bar-m{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-bottom:3px}
.bar-t{height:7px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar-f{height:100%;border-radius:99px;min-width:2px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ch{font-size:10px;color:var(--mute);text-align:center;padding:4px}
.cd{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:var(--card2);
  color:var(--tx);font-size:12px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:0}
.cd.off{opacity:.5}.cd.today{border-color:var(--brand)}
.cd .d{width:6px;height:6px;border-radius:50%}
.cd .d.day{background:#5B8CFF}.cd .d.night{background:#A78BFA}.cd .d.off{background:#555}

.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.item:last-child{border:0}
.item .ico{font-size:20px;width:28px;text-align:center}
.item .meta{flex:1;min-width:0}
.item .ti{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .su{font-size:12px;color:var(--mute)}
.item .am{font-weight:700;white-space:nowrap}

.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:600;font-size:14px;cursor:pointer;width:100%}
.bp{background:linear-gradient(145deg,var(--brand),var(--brand2));color:#2A1608;box-shadow:0 6px 20px var(--glow)}
.bs{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.bg{background:0;color:var(--mute);border:0;padding:8px 0}
.bd{background:rgba(255,107,102,.14);color:var(--bad);border:1px solid rgba(255,107,102,.28)}

.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
.field input,.field select,textarea{
  width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);color:var(--tx);font-size:16px}
.field input:focus,.field select:focus{outline:0;border-color:rgba(229,167,94,.5);box-shadow:0 0 0 3px rgba(229,167,94,.12)}
.field select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%238B8C9A' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.field input[type=number]{-moz-appearance:textfield}
.field input[type=number]::-webkit-outer-spin-button,
.field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

.fab{position:fixed;left:50%;bottom:calc(18px + var(--safe));transform:translateX(-50%);
  width:var(--fab);height:var(--fab);border-radius:50%;border:0;
  background:linear-gradient(150deg,#F0C384,var(--brand) 40%,var(--brand2));
  color:#2A1608;font-size:30px;font-weight:300;line-height:1;cursor:pointer;z-index:100;
  box-shadow:0 10px 28px var(--glow),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .22s cubic-bezier(.22,.9,.28,1),background .2s}
.fab.open{transform:translateX(-50%) rotate(45deg);background:linear-gradient(150deg,#524C5C,#332F3B);color:#F3F2ED}
.bd-nav{position:fixed;inset:0;z-index:80;background:rgba(4,6,12,.6);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .25s}
.bd-nav.show{opacity:1;pointer-events:auto}
.arc{position:fixed;left:50%;bottom:calc(18px + var(--safe) + 22px);width:0;height:0;z-index:90;pointer-events:none}
.arc.show{pointer-events:auto}
.nb{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
  border:1px solid rgba(229,167,94,.15);background:linear-gradient(160deg,#2A2634,#1B1720);
  color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  opacity:0;transform:scale(.3);transition:transform .3s cubic-bezier(.22,1,.32,1),opacity .25s;
  box-shadow:0 10px 24px rgba(0,0,0,.4);padding:0}
.arc.show .nb{opacity:1}
.nb .ic{font-size:18px}.nb .lb{font-size:8px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb.add{background:linear-gradient(150deg,#F0C384,var(--brand) 40%,var(--brand2));color:#2A1608;border:0}
.nb.add .lb{color:rgba(42,22,8,.7)}

.mw{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.mw{align-items:center}}
.mo{background:var(--card);width:100%;max-width:480px;max-height:88vh;overflow:auto;
  border-radius:22px 22px 0 0;padding:20px 20px calc(22px + var(--safe))}
@media(min-width:640px){.mo{border-radius:22px}}
.mo h2{margin:0 0 14px;font-size:18px}
.ma{display:flex;gap:10px;margin-top:14px}.ma .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe));transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:11px 16px;
  border-radius:12px;z-index:200;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}

.cloud-wrap{position:relative}
.cloud-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card2);
  color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;padding:0}
.cloud-dot{position:absolute;right:2px;bottom:2px;width:10px;height:10px;border-radius:50%;background:#555;border:2px solid var(--card)}
.cloud-dot.on{background:var(--brand)}
.cloud-menu{position:absolute;right:0;top:48px;width:260px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:12px;z-index:200;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.cloud-email{font-weight:600;margin-bottom:4px;word-break:break-all;font-size:13px}
.cloud-st{font-size:12px;color:var(--mute);margin-bottom:10px}.cloud-st.ok{color:var(--ok)}
.cloud-menu .btn{margin-bottom:6px}
.cloud-auth{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.cloud-auth-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:380px;position:relative}
.cloud-auth-msg{font-size:13px;color:var(--warn);min-height:18px;margin-bottom:8px}

.rc-grid{display:grid;gap:8px;margin-bottom:10px}
.rc{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);color:var(--tx);cursor:pointer;font-size:14px}
.rc.on{border-color:rgba(229,167,94,.45);background:rgba(229,167,94,.1)}
.rc .sub{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.empty{text-align:center;padding:28px 12px;color:var(--mute)}.empty .e{font-size:32px;margin-bottom:6px}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brandHome" type="button"><i></i> Копейка</button>
  <div class="top-sp"></div>
  <div class="top-act" id="topAct"></div>
</header>
<main id="main"></main>
<button type="button" class="fab" id="fab">+</button>
<div class="bd-nav" id="navBd"></div>
<div class="arc" id="navArc"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js?v=1"></script>
<script src="cloud.js?v=1"></script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
