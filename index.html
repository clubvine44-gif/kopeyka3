<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0F1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Копейка</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0F1014; --card:#181A21; --card2:#1E2129; --line:#2A2D38;
  --text:#F2F3F7; --muted:#8B90A0; --accent:#E5A75E; --green:#4ADE80;
  --red:#F87171; --blue:#60A5FA; --purple:#A78BFA;
  --radius:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.4;overflow-x:hidden}
body{padding-top:var(--safe-t);padding-bottom:calc(80px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit;border:none;outline:none;background:none}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(15,16,20,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:.02em}
.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);font-size:18px}
.icon-btn.on{border-color:var(--accent);color:var(--accent)}
.wrap{padding:12px 14px 24px;max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;font-weight:600}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card2);font-size:13px;border:1px solid var(--line)}
.pill.day{border-color:#FBBF24;color:#FBBF24}
.pill.night{border-color:#818CF8;color:#818CF8}
.pill.off{border-color:#6B7280;color:#9CA3AF}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal-h{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal-d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;background:var(--card2);border:1px solid transparent;position:relative}
.cal-d.today{border-color:var(--accent)}
.cal-d.other{opacity:.35}
.cal-d .dot{width:5px;height:5px;border-radius:50%;margin-top:2px}
.cal-d.day .dot{background:#FBBF24}
.cal-d.night .dot{background:#818CF8}
.cal-d.off .dot{background:#6B7280}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:16px}
.stat span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--card2);border-radius:12px;border:1px solid var(--line);gap:10px}
.item .left{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .amt{font-weight:600;white-space:nowrap}
.amt.plus{color:var(--green)}
.amt.minus{color:var(--red)}
.fab-wrap{position:fixed;right:18px;bottom:calc(18px + var(--safe-b));z-index:60}
.fab{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#F0C384,#E5A75E);color:#1A1208;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(229,167,94,.35);border:none;transition:transform .2s}
.fab.open{transform:rotate(45deg)}
.radial{position:absolute;right:0;bottom:70px;display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transform:translateY(12px);transition:.2s}
.radial.show{opacity:1;pointer-events:auto;transform:none}
.radial button{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:rgba(24,26,33,.95);border:1px solid var(--line);backdrop-filter:blur(12px);white-space:nowrap;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.radial button span.ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + var(--safe-b));border:1px solid var(--line);border-bottom:none}
.modal h2{font-size:18px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.field textarea{min-height:70px;resize:vertical}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:600;text-align:center}
.btn.primary{background:linear-gradient(135deg,#F0C384,#E5A75E);color:#1A1208}
.btn.ghost{background:var(--card2);border:1px solid var(--line)}
.btn.danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:100;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#E5A75E,#F0C384);border-radius:99px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600}
.seg button.on{border-color:var(--accent);color:var(--accent);background:rgba(229,167,94,.1)}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:14px}
.cloud-status{font-size:11px;color:var(--muted);margin-left:4px}
</style>
</head>
<body>
<div class="topbar">
  <h1>Копейка</h1>
  <div class="top-actions">
    <button class="icon-btn" id="btnCloud" title="Облако">☁</button>
    <button class="icon-btn" id="btnMonth" title="Месяц">📅</button>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="fab-wrap">
  <div class="radial" id="radial">
    <button data-act="income"><span class="ic" style="background:rgba(74,222,128,.15)">➕</span> Доход</button>
    <button data-act="expense"><span class="ic" style="background:rgba(248,113,113,.15)">➖</span> Расход</button>
    <button data-act="reserve"><span class="ic" style="background:rgba(96,165,250,.15)">🏦</span> Резерв</button>
    <button data-act="debt"><span class="ic" style="background:rgba(167,139,250,.15)">📉</span> Долг</button>
  </div>
  <button class="fab" id="fab">+</button>
</div>

<div class="modal-bg" id="modalBg"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script src="cloud.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
