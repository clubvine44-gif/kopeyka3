<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0A0B0E"><title>Финн</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{
  --bg:#0B1220;
  --bg2:#0E1628;
  --card:rgba(18,28,48,.55);
  --card2:rgba(22,34,58,.65);
  --glass:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.12);
  --line2:rgba(120,180,255,.18);
  --text:#E8F0FF;
  --muted:#8BA0C0;
  --accent:#5EC8FF;
  --gold:#F0C060;
  --green:#4ADE80;
  --red:#F87171;
  --blue:#60A5FA;
  --radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --nav-h:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.4;overflow-x:hidden}
body{
  padding-top:var(--safe-t);
  padding-bottom:calc(84px + var(--safe-b));
  background:
    radial-gradient(ellipse 120% 80% at 50% -20%,rgba(40,90,180,.25),transparent 50%),
    radial-gradient(ellipse 80% 50% at 100% 50%,rgba(20,60,140,.12),transparent 40%),
    linear-gradient(180deg,#0A101C 0%,#0B1220 40%,#0E1628 100%);
  min-height:100%;
}
button,input,select{font:inherit;color:inherit;border:none;outline:none;background:none;cursor:pointer}

/* Topbar glass */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
  background:rgba(10,16,28,.72);
  backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid var(--line);
}
.finn-avatar{
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;transition:transform .2s;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 0 20px rgba(94,200,255,.15), inset 0 0 12px rgba(255,255,255,.05);
}
.finn-avatar:active{transform:scale(.92)}
.finn-avatar svg{width:42px;height:42px}
.finn-tip{
  position:absolute;top:54px;left:50%;transform:translateX(-50%);
  background:var(--card2);border:1px solid var(--line);
  padding:8px 12px;border-radius:12px;font-size:12px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;
  box-shadow:0 8px 24px rgba(0,0,0,.45);backdrop-filter:blur(12px);
}
.finn-avatar.show-tip .finn-tip{opacity:1}
.top-actions{display:flex;gap:8px}
.icon-btn{
  width:40px;height:40px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  font-size:18px;
  transition:background .15s,border-color .15s;
}
.icon-btn:active{background:rgba(255,255,255,.12)}

.wrap{padding:12px 14px 24px;max-width:520px;margin:0 auto}

/* Glass cards */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  backdrop-filter:blur(24px) saturate(1.3);
  -webkit-backdrop-filter:blur(24px) saturate(1.3);
  box-shadow:0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.06);
}
.card.hero{
  background:linear-gradient(145deg,rgba(30,50,90,.5),rgba(18,28,48,.55));
  border:1px solid rgba(120,180,255,.2);
  box-shadow:0 12px 40px rgba(0,20,60,.35), inset 0 1px 0 rgba(255,255,255,.08);
  overflow:hidden;
  position:relative;
}
.card.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 20% 30%,rgba(94,200,255,.12),transparent 60%);
  pointer-events:none;
}
.card.tight{padding:14px}

/* Hero layout closer to screenshot */
.hero-main{display:flex;gap:16px;align-items:center;position:relative;z-index:1}
.orbit-wrap{position:relative;width:110px;height:110px;flex-shrink:0}
.orbit-svg{width:110px;height:110px;filter:drop-shadow(0 0 8px rgba(94,200,255,.25))}
.orbit-core{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
}
.orbit-val{font-size:22px;font-weight:800;letter-spacing:-.03em;color:#fff;text-shadow:0 0 12px rgba(94,200,255,.4)}
.orbit-sub{font-size:11px;color:var(--muted);margin-top:2px}
.hero-stats{flex:1;min-width:0}
.hero-shift{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--gold);
  background:rgba(240,192,96,.12);
  border:1px solid rgba(240,192,96,.25);
  padding:5px 12px;border-radius:999px;margin-bottom:10px;
}
.ring-legend{display:flex;flex-direction:column;gap:7px}
.ring-leg-item{
  display:flex;align-items:center;gap:8px;font-size:13px;
}
.ring-leg-item .leg-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 6px currentColor;
}
.ring-leg-item .leg-name{flex:1;color:var(--muted)}
.ring-leg-item b{font-weight:700;font-variant-numeric:tabular-nums}

/* Mini sparkline placeholder */
.spark-wrap{margin-top:10px;height:36px;opacity:.7}
.spark-wrap svg{width:100%;height:100%}

/* Calendar glass */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month-title{font-size:16px;font-weight:700;text-align:center;flex:1;letter-spacing:-.02em}
.mnav{
  width:36px;height:36px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  font-size:20px;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.mnav:active{background:rgba(255,255,255,.14)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:4px}
.cal-h{text-align:center;font-size:11px;color:var(--muted);font-weight:500;padding-bottom:4px}
.cal-d{
  aspect-ratio:1;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:500;
  background:rgba(255,255,255,.04);
  border:1px solid transparent;
  transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;
  position:relative;
}
.cal-d:active{transform:scale(.92)}
.cal-d.today{
  border:1.5px solid var(--gold);
  background:rgba(240,192,96,.1);
  box-shadow:0 0 12px rgba(240,192,96,.25);
  font-weight:700;
}
.cal-d.other{opacity:.3}
.cal-d .dot{
  width:5px;height:5px;border-radius:50%;margin-top:3px;
  box-shadow:0 0 5px currentColor;
}
.cal-d.day .dot{background:#F0C060;color:#F0C060}
.cal-d.night .dot{background:#60A5FA;color:#60A5FA}
.cal-d.off .dot{background:#6B7A90;color:#6B7A90}
.cal-d.has-obl{box-shadow:inset 0 0 0 1.5px rgba(248,113,113,.5)}
.cal-d.selected{
  border-color:var(--accent);
  background:rgba(94,200,255,.12);
  box-shadow:0 0 14px rgba(94,200,255,.3);
}
.cal-d .star{
  position:absolute;top:2px;right:4px;font-size:8px;line-height:1;
  filter:drop-shadow(0 0 3px rgba(240,192,96,.7));
  animation:starPulse 2.4s ease-in-out infinite;
}
@keyframes starPulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}

.btn-shift{
  width:100%;margin-top:12px;padding:12px;
  border-radius:14px;font-weight:600;font-size:14px;
  background:linear-gradient(135deg,rgba(94,200,255,.15),rgba(94,200,255,.08));
  border:1px solid rgba(94,200,255,.3);
  color:var(--accent);
  box-shadow:0 4px 16px rgba(40,100,180,.2);
  transition:transform .15s,background .15s;
}
.btn-shift:active{transform:scale(.98)}

/* Quick nav cards */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-nav{
  text-align:left;padding:14px;border-radius:16px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  transition:background .15s,border-color .15s,transform .12s;
}
.quick-nav:active{transform:scale(.97);background:rgba(255,255,255,.09)}
.quick-nav .qn-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.quick-nav b{font-size:16px;font-weight:700}

/* Sections, lists, items */
.sec{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.sec-head{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;text-align:left}
.sec-title{font-size:14px;font-weight:600;flex:1}
.sec-right{font-size:13px;color:var(--muted);font-weight:600}
.sec-chev{font-size:16px;color:var(--muted);transform:rotate(90deg);transition:transform .2s}
.sec.open .sec-chev{transform:rotate(-90deg)}
.sec-body{display:none;padding:0 12px 12px}
.sec.open .sec-body{display:block}
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:rgba(255,255,255,.04);
  border-radius:14px;border:1px solid var(--line);
  transition:background .15s;
}
.item:active{background:rgba(255,255,255,.08)}
.item .left{display:flex;flex-direction:column;font-size:13px;gap:2px}
.item .amt{font-weight:700;font-size:14px}
.plus,.amt.plus{color:var(--green)}.minus,.amt.minus,.neg{color:var(--red)}
.empty.tight{padding:16px;text-align:center;color:var(--muted);font-size:13px}
.hint{margin-top:10px;font-size:12px;color:var(--muted);padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line)}

/* Bottom nav glass */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:space-around;align-items:center;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(10,16,28,.82);
  backdrop-filter:blur(24px) saturate(1.4);
  -webkit-backdrop-filter:blur(24px) saturate(1.4);
  border-top:1px solid var(--line);
  box-shadow:0 -8px 32px rgba(0,0,0,.3);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:6px 4px;font-size:10px;color:var(--muted);
  transition:color .15s;
}
.bn-item.active{color:var(--accent)}
.bn-item.active .bn-ic{background:rgba(94,200,255,.15);border-color:rgba(94,200,255,.3)}
.bn-item .bn-ic{
  width:36px;height:28px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;transition:background .15s,border-color .15s;
}
.bn-item .bn-ic svg{width:22px;height:22px}
body.has-bnav{padding-bottom:calc(var(--nav-h) + 20px + var(--safe-b))}

/* FAB */
.fab{
  position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);z-index:45;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(145deg,#F8D48A,#E5A75E);
  color:#0A101C;font-size:28px;font-weight:300;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(220,160,80,.45),0 0 0 1px rgba(255,255,255,.2);
  transition:transform .2s,box-shadow .2s;
}
.fab:active{transform:scale(.92)}
.fab.open{transform:rotate(45deg)}

/* Misc */
.view-header{display:flex;align-items:center;gap:12px;padding:2px 0 16px}
.view-header .back-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
}
.view-header h2{font-size:18px;font-weight:700;flex:1}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 30px + var(--safe-b));
  transform:translateX(-50%) translateY(20px);opacity:0;
  background:rgba(20,30,50,.92);backdrop-filter:blur(16px);
  border:1px solid var(--line);padding:10px 18px;border-radius:14px;
  font-size:13px;z-index:100;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:0 8px 28px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--muted);font-size:12px}
.big{font-size:26px;font-weight:700}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;font-weight:600}

.fab-wrap{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);z-index:45}
.radial{
  position:absolute;right:0;bottom:68px;
  display:none;flex-direction:column;gap:8px;
  background:rgba(14,22,40,.92);backdrop-filter:blur(20px);
  border:1px solid var(--line);border-radius:18px;padding:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.45);min-width:160px;
}
.radial.show{display:flex}
.radial button{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:12px;font-size:14px;font-weight:500;
  background:rgba(255,255,255,.04);border:1px solid transparent;
  transition:background .15s;
}
.radial button:active{background:rgba(255,255,255,.1)}
.radial .ic{font-size:16px}
.modal-bg{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.95);
  z-index:70;width:min(360px,92vw);max-height:80vh;overflow:auto;
  background:rgba(16,26,46,.95);backdrop-filter:blur(28px);
  border:1px solid var(--line);border-radius:22px;padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-size:17px;font-weight:700;margin-bottom:14px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input,.modal select,.modal textarea{
  width:100%;padding:11px 12px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  color:var(--text);font-size:15px;
}
.modal .row{display:flex;gap:10px;margin-top:16px}
.modal .btn{
  flex:1;padding:12px;border-radius:14px;font-weight:600;font-size:14px;
  background:rgba(94,200,255,.15);border:1px solid rgba(94,200,255,.3);color:var(--accent);
}
.modal .btn.primary{background:linear-gradient(135deg,#5EC8FF,#3A8FE8);color:#0A101C;border:none}
.modal .btn.danger{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.3);color:var(--red)}

/* Finn avatar aura pulse */
.finn-aura{
  position:absolute;inset:-4px;border-radius:50%;
  border:2px solid rgba(74,222,128,.45);
  opacity:0;pointer-events:none;
  animation:finnAuraPulse 2.6s ease-in-out infinite;
}
.finn-avatar.status-green .finn-aura{border-color:rgba(74,222,128,.55)}
.finn-avatar.status-orange .finn-aura{border-color:rgba(251,191,36,.55)}
.finn-avatar.status-red .finn-aura{border-color:rgba(248,113,113,.55)}
@keyframes finnAuraPulse{
  0%,100%{opacity:.35;transform:scale(.92)}
  50%{opacity:.9;transform:scale(1.08)}
}
/* FAB pulse cyan */
.fab{
  position:relative;
  background:linear-gradient(145deg,#5EC8FF,#3A8FE8)!important;
  color:#0A101C!important;
  box-shadow:0 6px 24px rgba(60,140,220,.45),0 0 0 2px rgba(94,200,255,.35)!important;
  animation:fabIdlePulse 2.8s ease-in-out infinite;
}
.fab.finn-idle{animation:fabIdlePulse 2.8s ease-in-out infinite!important}
.fab.finn-active, .fab.open{animation:fabActivePulse 1s ease-in-out infinite!important}
@keyframes fabIdlePulse{
  0%,100%{box-shadow:0 6px 24px rgba(60,140,220,.45),0 0 0 2px rgba(94,200,255,.35)}
  50%{box-shadow:0 8px 32px rgba(60,140,220,.6),0 0 0 5px rgba(94,200,255,.18)}
}
@keyframes fabActivePulse{
  0%,100%{box-shadow:0 0 0 3px rgba(94,200,255,.9),0 0 22px rgba(94,200,255,.55)}
  50%{box-shadow:0 0 0 10px rgba(94,200,255,.1),0 0 36px rgba(94,200,255,.7)}
}
/* Modal glass + scroll */
.modal-bg.show{display:flex!important;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + var(--safe-b))}
.modal-bg .modal-card, .modal-card{
  width:100%;max-width:420px;max-height:min(85vh,640px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:rgba(14,22,40,.92)!important;
  backdrop-filter:blur(28px) saturate(1.3)!important;
  -webkit-backdrop-filter:blur(28px) saturate(1.3)!important;
  border:1px solid rgba(120,180,255,.2)!important;
  border-radius:22px 22px 18px 18px!important;
  padding:18px 16px 20px!important;
  box-shadow:0 16px 48px rgba(0,0,0,.5)!important;
  color:var(--text);margin:0 auto;
}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px;letter-spacing:-.02em}
.set-group{margin-bottom:14px}
.set-group-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;font-weight:600}
.set-row{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:12px;margin-bottom:6px;text-align:left;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;
}
.set-row:active{background:rgba(255,255,255,.09)}
.set-row.danger{border-color:rgba(248,113,113,.25)}
.set-main{flex:1;min-width:0}
.set-main b{display:block;font-size:14px;font-weight:600}
.set-main span{font-size:11px;color:var(--muted)}
.set-val{font-size:13px;font-weight:600;color:var(--accent);flex-shrink:0}
.btn-primary{
  width:100%;margin-top:8px;padding:13px;border-radius:14px;font-weight:700;font-size:15px;
  background:linear-gradient(135deg,#5EC8FF,#3A8FE8);color:#0A101C;border:none;
}
.sp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.sp-item{text-align:center;padding:14px 8px;background:rgba(255,255,255,.05);border-radius:14px;border:1px solid var(--line)}
.sp-item b{display:block;font-size:22px;font-weight:800}
.sp-item span{font-size:11px;color:var(--muted)}
.sp-pay{text-align:center;padding:14px;margin:8px 0;background:rgba(94,200,255,.08);border-radius:14px;border:1px solid rgba(94,200,255,.2)}
/* Performance */
.card,.bottom-nav,.topbar,.fab-wrap,.modal-card{transform:translateZ(0);backface-visibility:hidden}
.wrap{content-visibility:auto}

</style></head><body class="has-bnav"><div class="topbar"><div class="top-actions" style="width:80px"><button class="icon-btn" id="btnCloud" title="Облако">☁</button></div>

<script>
(function(){
  function syncNav(){
    var v = (window.currentView || (typeof currentView!=='undefined'?currentView:'home')) || 'home';
    // currentView is local to app.js closure, so use data attribute or global
    document.querySelectorAll('#bottomNav .bn-item').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-view') === (window.__finView||'home'));
    });
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('#bottomNav .bn-item');
    if(!b) return;
    e.preventDefault();
    var v = b.getAttribute('data-view') || 'home';
    window.__finView = v;
    if(typeof goView === 'function') goView(v);
    else if(typeof goHome === 'function' && v==='home') goHome();
    document.querySelectorAll('#bottomNav .bn-item').forEach(function(x){x.classList.toggle('active', x===b);});
  });
  // swipe right to go back
  var sx=0, sy=0;
  document.addEventListener('touchstart', function(e){ if(e.touches[0]){sx=e.touches[0].clientX;sy=e.touches[0].clientY;} }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!e.changedTouches[0]) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if(dx > 80 && Math.abs(dy) < 60){
      if(window.__finView && window.__finView !== 'home' && typeof goHome === 'function'){
        window.__finView = 'home';
        goHome();
        document.querySelectorAll('#bottomNav .bn-item').forEach(function(x){x.classList.toggle('active', x.getAttribute('data-view')==='home');});
      }
    }
  }, {passive:true});
})();
</script>
