<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0A0B0E">
<title>Копейка</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0A0B0E;--card:#16181F;--card2:#1C1F28;--line:rgba(255,255,255,.09);--text:#F2F3F7;--muted:#9AA0B0;--accent:#E5A75E;--green:#4ADE80;--red:#F87171;--radius:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.4;overflow-x:hidden}body{padding-top:var(--safe-t);padding-bottom:calc(84px + var(--safe-b))}button,input,select{font:inherit;color:inherit;border:none;outline:none;background:none;cursor:pointer}.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(10,11,14,.92);border-bottom:1px solid var(--line)}.topbar h1{font-size:17px;font-weight:700}.top-actions{display:flex;gap:8px}.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);font-size:17px}.wrap{padding:10px 12px 20px;max-width:520px;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:8px}.plus,.amt.plus{color:var(--green)}.minus,.amt.minus,.neg{color:var(--red)}.fab-wrap{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:60}.fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#F0C384,#E5A75E);color:#1A1208;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(229,167,94,.4);border:none}.fab.open{transform:rotate(45deg)}.radial{position:absolute;right:0;bottom:66px;display:flex;flex-direction:column;gap:8px;opacity:0;pointer-events:none;transform:translateY(12px);transition:.15s}.radial.show{opacity:1;pointer-events:auto}.radial button{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.35);font-size:14px}.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:100;opacity:0;pointer-events:none;transition:.2s;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:flex-end;justify-content:center}.modal-bg.show{display:flex}.modal-card{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:#16181F;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + var(--safe-b));border:1px solid var(--line)}#btnVoice{display:none!important}
</style>
</head>
<body>
<div class="topbar"><h1>Копейка</h1><div class="top-actions"><button class="icon-btn" id="btnCloud" title="Облако">☁</button><button class="icon-btn" id="btnSettings" title="Настройки">⚙</button></div></div>
<div class="wrap" id="app"></div>
<div class="fab-wrap"><div class="radial" id="radial"><button data-act="income">➕ Доход</button><button data-act="expense">➖ Расход</button><button data-act="reserve">🏦 Резерв</button><button data-act="debt">📉 Долг</button><button data-act="oblig">📅 Обязательный</button></div><button class="fab" id="fab">+</button></div>
<div class="modal-bg" id="modalBg"></div><div class="toast" id="toast"></div>
<script src="app.js?v=17"></script>
<script src="onboard.js?v=13"></script>
<script src="cloud.js?v=16"></script>
<script src="voice.js?v=16"></script>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=35').catch(function(e){console.error('Копейка SW:',e);});
</script>
</body>
</html>
