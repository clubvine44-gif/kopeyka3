<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0F1014">
<title>Копейка</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#0F1014;--card:#181A21;--card2:#1E2129;--line:#2A2D38;--text:#F2F3F7;--muted:#8B90A0;--accent:#E5A75E;--green:#4ADE80;--red:#F87171;--radius:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.4;overflow-x:hidden}
body{padding-top:var(--safe-t);padding-bottom:calc(80px + var(--safe-b))}
button,input,select{font:inherit;color:inherit;border:none;outline:none;background:none;cursor:pointer}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(15,16,20,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;font-weight:700}.top-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);font-size:17px}
.icon-btn.on{border-color:var(--accent);color:var(--accent)}
.wrap{padding:10px 12px 20px;max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.card.tight{padding:12px}
.card.hero{background:radial-gradient(130% 160% at 100% 0%,rgba(229,167,94,.12),transparent 55%),linear-gradient(160deg,#1A1C24,#161820)}
.card.hero.compact{padding:14px}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;font-weight:600}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em}.muted{color:var(--muted);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero-side{display:flex;flex-direction:column;gap:8px;text-align:right;min-width:100px}
.hero-side .hs{display:flex;flex-direction:column}
.hero-side .hs b{font-size:16px;font-weight:700}
.hero-side .hs span{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:11px;padding:4px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.chip.plus{color:var(--green);border-color:rgba(74,222,128,.25)}
.chip.minus{color:var(--red);border-color:rgba(248,113,113,.25)}
.chip.warn{color:#FBBF24;border-color:rgba(251,191,36,.3)}
.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--card2);font-size:12px;border:1px solid var(--line)}
.pill.day{border-color:#FBBF24;color:#FBBF24}.pill.night{border-color:#818CF8;color:#818CF8}.pill.off{border-color:#6B7280;color:#9CA3AF}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.cal-h{text-align:center;font-size:10px;color:var(--muted);padding:2px 0}
.cal-d{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;background:var(--card2);border:1px solid transparent}
.cal-d.today{border-color:var(--accent)}.cal-d.other{opacity:.35}.cal-d .dot{width:4px;height:4px;border-radius:50%;margin-top:1px}
.cal-d.day .dot{background:#FBBF24}.cal-d.night .dot{background:#818CF8}.cal-d.off .dot{background:#6B7280}
.cal-d.has-obl{box-shadow:inset 0 0 0 1px rgba(248,113,113,.45)}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.month-title{font-size:14px;font-weight:700;text-align:center;flex:1}
.mnav{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.plus,.amt.plus{color:var(--green)}.minus,.amt.minus,.neg{color:var(--red)}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--card2);border-radius:11px;border:1px solid var(--line);gap:8px}
.item .left{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:13px}.item .amt{font-weight:600;white-space:nowrap;font-size:13px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.sec-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left}
.sec-title{font-size:13px;font-weight:600;flex:1}
.sec-right{font-size:13px;color:var(--muted);font-weight:600}
.sec-chev{font-size:16px;color:var(--muted);transition:transform .2s;transform:rotate(90deg)}
.sec.open .sec-chev{transform:rotate(-90deg)}
.sec-body{display:none;padding:0 12px 12px}
.sec.open .sec-body{display:block;border-top:1px solid var(--line);padding-top:10px}
.mini-cat{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.mini-cat .leg-name{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-cat .leg-pct{color:var(--muted);font-size:12px;min-width:28px}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.empty{text-align:center;padding:16px;color:var(--muted);font-size:13px}
.empty.tight{padding:8px}
.fab-wrap{position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:60}
.fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#F0C384,#E5A75E);color:#1A1208;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(229,167,94,.35);border:none;transition:transform .2s}
.fab.open{transform:rotate(45deg)}
.radial{position:absolute;right:0;bottom:66px;display:flex;flex-direction:column;gap:8px;opacity:0;pointer-events:none;transform:translateY(12px);transition:.2s}
.radial.show{opacity:1;pointer-events:auto;transform:none}
.radial button{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:rgba(24,26,33,.96);border:1px solid var(--line);backdrop-filter:blur(12px);white-space:nowrap;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:14px}
.radial button span.ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:100;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body>
<div class="topbar"><h1>Копейка</h1><div class="top-actions"><button class="icon-btn" id="btnCloud">☁</button><button class="icon-btn" id="btnMonth">📅</button></div></div>
<div class="wrap" id="app"></div>
<div class="fab-wrap"><div class="radial" id="radial">
<button data-act="income"><span class="ic" style="background:rgba(74,222,128,.15)">➕</span> Доход</button>
<button data-act="expense"><span class="ic" style="background:rgba(248,113,113,.15)">➖</span> Расход</button>
<button data-act="reserve"><span class="ic" style="background:rgba(96,165,250,.15)">🏦</span> Резерв</button>
<button data-act="debt"><span class="ic" style="background:rgba(167,139,250,.15)">📉</span> Долг</button>
<button data-act="oblig"><span class="ic" style="background:rgba(251,146,60,.15)">📅</span> Обязательный</button>
</div><button class="fab" id="fab">+</button></div>
<div class="toast" id="toast"></div>
<script src="app.js?v=7"></script>
<script src="cloud.js?v=7"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=7').catch(function(){});</script>
</body></html>
