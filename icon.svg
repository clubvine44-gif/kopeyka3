<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0%" stop-color="#12141C"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="coin" x1="18" y1="14" x2="110" y2="114">
      <stop offset="0%" stop-color="#F8E0A8"/>
      <stop offset="40%" stop-color="#E5A75E"/>
      <stop offset="100%" stop-color="#B86B2E"/>
    </linearGradient>
    <linearGradient id="shine" x1="40" y1="30" x2="90" y2="90">
      <stop offset="0%" stop-color="#FFF6D6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E5A75E" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- rounded app background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- soft outer ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="rgba(229,167,94,0.18)" stroke-width="2"/>
  <!-- main coin -->
  <circle cx="64" cy="64" r="40" fill="url(#coin)" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="34" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.6"/>
  <circle cx="64" cy="64" r="28" fill="#1A1208"/>
  <!-- subtle shine -->
  <ellipse cx="52" cy="48" rx="14" ry="9" fill="url(#shine)"/>
  <!-- stylized F (Finn) -->
  <path d="M50 42h26c1.4 0 2.4.9 2.4 2.2v2.8c0 1.2-.9 2.1-2.1 2.1H57.2v6.8H73c1.2 0 2.2.9 2.2 2.1v2.6c0 1.2-1 2.1-2.2 2.1H57.2V84c0 1.3-1 2.3-2.3 2.3h-2.6c-1.3 0-2.3-1-2.3-2.3V44.2c0-1.2 1-2.2 2.3-2.2z" fill="url(#coin)"/>
  <!-- AI eyes (glowing dots) -->
  <circle cx="54" cy="58" r="3.2" fill="#4ADE80">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="74" cy="58" r="3.2" fill="#4ADE80">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
</svg>
