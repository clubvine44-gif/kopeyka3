<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kopeyka — recording</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.stage{width:100vw;height:100vh;display:flex;justify-content:center;align-items:stretch;background:#050608}.screen{position:relative;width:min(520px,100vw);height:100vh;overflow:hidden;background:#0A0B0E}iframe{display:block;width:100%;height:100%;border:0;background:#0A0B0E}.spot{position:absolute;z-index:9999;pointer-events:none;border:2px solid rgba(229,167,94,.95);border-radius:16px;opacity:0;box-shadow:0 0 0 9999px rgba(0,0,0,.46),0 0 24px rgba(229,167,94,.8),inset 0 0 18px rgba(229,167,94,.12);transition:left 1050ms cubic-bezier(.16,1,.3,1),top 1050ms cubic-bezier(.16,1,.3,1),width 1050ms cubic-bezier(.16,1,.3,1),height 1050ms cubic-bezier(.16,1,.3,1),opacity 550ms ease}.spot.on{opacity:1}.spot:after{content:"";position:absolute;inset:-5px;border-radius:inherit;border:1px solid rgba(229,167,94,.25);animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:1;transform:scale(1.018)}}.fade{position:absolute;inset:0;z-index:10000;background:#07080b;opacity:1;pointer-events:none;transition:opacity 1000ms ease}.fade.off{opacity:0}@media(min-width:521px){.screen{box-shadow:0 0 90px rgba(0,0,0,.75);border-left:1px solid rgba(255,255,255,.04);border-right:1px solid rgba(255,255,255,.04)}} </style></head><body><main class="stage"><section class="screen"><iframe id="app" src="index.html?showcase=1"></iframe><div id="spot" class="spot"></div><div id="fade" class="fade"></div></section></main><script>(function(){const frame=document.getElementById('app'),spot=document.getElementById('spot'),fade=document.getElementById('fade');const wait=ms=>new Promise(r=>setTimeout(r,ms));function d(){return frame.contentDocument}function visible(e){if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>2&&r.height>2}function q(sel){const x=d();return x?[...x.querySelectorAll(sel)].find(visible):null}function qs(sel){const x=d();return x?[...x.querySelectorAll(sel)].filter(visible):[]}function box(e){const r=e.getBoundingClientRect(),fr=frame.getBoundingClientRect();return{left:r.left+fr.left-5,top:r.top+fr.top-5,width:Math.min(fr.width,r.width+10),height:Math.min(fr.height,r.height+10)}}async function focus(e,time){if(!e)return;try{e.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'})}catch(_){}await wait(650);const b=box(e);spot.style.left=b.left+'px';spot.style.top=b.top+'px';spot.style.width=b.width+'px';spot.style.height=b.height+'px';spot.classList.add('on');await wait(time);spot.classList.remove('on');await wait(450)}function clickText(words){const x=d();if(!x)return null;const es=[...x.querySelectorAll('button,a,[role="button"]')].filter(visible);const e=es.find(el=>{const t=(el.innerText||el.textContent||'').trim().toLowerCase();return words.some(w=>t.includes(w))});if(e){e.click();return e}return null}function bottom(){const x=d();if(!x)return null;return [...x.body.querySelectorAll('*')].filter(visible).filter(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return (s.position==='fixed'||s.position==='sticky')&&r.bottom>=x.documentElement.clientHeight-10&&r.width>x.documentElement.clientWidth*.55&&r.height>40}).sort((a,b)=>b.getBoundingClientRect().width-a.getBoundingClientRect().width)[0]||null}async function run(){await wait(900);fade.classList.add('off');await wait(1100);await focus(q('.topbar'),2500);await focus(q('.hero'),3800);const fab=q('.fab');if(fab){await focus(fab,1900);if(!fab.classList.contains('open')){fab.click();await wait(600)}const menu=q('.radial.show');if(menu)await focus(menu,2500);fab.click()}const cal=q('.cal');if(cal)await focus(cal,4200);const secs=qs('.sec');for(const s of secs.slice(0,5)){if(!s.classList.contains('open')){const h=s.querySelector('.sec-head');if(h)h.click();await wait(180)}await focus(s,2600)}await focus(q('.finn-avatar'),3000);await focus(bottom(),3300);for(const words of [['календар'],['операц'],['аналит'],['настрой']]){const e=clickText(words);if(e){await wait(1000);await focus(q('.wrap')||q('main')||q('body'),3200)}}spot.classList.remove('on');fade.classList.remove('off');}frame.addEventListener('load',()=>setTimeout(run,500));})();</script></body></html>
