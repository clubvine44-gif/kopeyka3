<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Копейка — showcase</title>
<style>
:root{--gold:#e5a75e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#050608;overflow:hidden}
#camera{position:absolute;left:50%;top:50%;width:430px;height:932px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center center;overflow:hidden;background:#0a0b0e}
#app{display:block;width:100%;height:100%;border:0;background:#0a0b0e}
#shade{position:fixed;inset:0;z-index:20;pointer-events:none;background:rgba(0,0,0,.56);opacity:0;transition:opacity 900ms cubic-bezier(.22,1,.36,1)}
#spot{position:fixed;z-index:21;pointer-events:none;left:0;top:0;width:0;height:0;border:2px solid rgba(246,199,128,.98);border-radius:16px;opacity:0;will-change:left,top,width,height;border-radius;transition:left 1250ms cubic-bezier(.16,1,.3,1),top 1250ms cubic-bezier(.16,1,.3,1),width 1250ms cubic-bezier(.16,1,.3,1),height 1250ms cubic-bezier(.16,1,.3,1),border-radius 1250ms cubic-bezier(.16,1,.3,1),opacity 500ms ease;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 26px rgba(229,167,94,.48),0 0 80px rgba(229,167,94,.20)}
#spot:after{content:"";position:absolute;inset:-10px;border:1px solid rgba(229,167,94,.22);border-radius:inherit;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.995);opacity:.15}50%{transform:scale(1.018);opacity:.72}}
#spot.on{opacity:1}
#transition{position:fixed;inset:0;z-index:30;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(229,167,94,.12),transparent 34%);opacity:0}
#transition.go{animation:flash 950ms cubic-bezier(.22,1,.36,1)}
@keyframes flash{0%{opacity:0}28%{opacity:1}100%{opacity:0}}
#black{position:fixed;inset:0;z-index:40;background:#050608;pointer-events:none;transition:opacity 1100ms cubic-bezier(.22,1,.36,1)}
#black.off{opacity:0}
@media (max-width:700px){#camera{width:100vw;height:100dvh;transform:none;left:0;top:0}}
</style>
</head>
<body>
<div id="stage"><div id="camera"><iframe id="app" src="index.html?showcase=1&demo=1"></iframe></div></div>
<div id="shade"></div><div id="spot"></div><div id="transition"></div><div id="black"></div>
<script>
const frame=document.getElementById('app');
const camera=document.getElementById('camera');
const spot=document.getElementById('spot');
const shade=document.getElementById('shade');
const transition=document.getElementById('transition');
const black=document.getElementById('black');
let current=-1,timer=null;

function doc(){return frame.contentDocument||frame.contentWindow.document}
function visible(e){if(!e)return false;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'}
function first(selectors){for(const s of selectors){try{const e=doc().querySelector(s);if(visible(e))return e}catch(_){}}return null}
function text(words){try{const els=[...doc().querySelectorAll('button,a,[role="button"],.sec-head,.sec-title,nav *,footer *,[class*="tab"]')];return els.find(e=>visible(e)&&words.some(w=>(e.textContent||'').trim().toLowerCase().includes(w)))}catch(_){return null}}
function section(words){try{const hs=[...doc().querySelectorAll('.sec-head,.sec-title')];return hs.find(e=>visible(e)&&words.some(w=>(e.textContent||'').toLowerCase().includes(w)))?.closest('.sec')||null}catch(_){return null}}
function bottomNav(){try{const root=doc().documentElement.clientHeight;const candidates=[...doc().querySelectorAll('nav,footer,[class*="bottom"],[class*="nav"],[class*="tabbar"],[class*="tabs"]')].filter(visible);let best=null,score=-1;for(const e of candidates){const r=e.getBoundingClientRect(),s=getComputedStyle(e);let sc=0;if(r.bottom>=root-14)sc+=5;if(r.height>=45&&r.height<=110)sc+=3;if(r.width>=doc().documentElement.clientWidth*.7)sc+=3;if(s.position==='fixed'||s.position==='sticky')sc+=5;if(sc>score){score=sc;best=e}}return score>=7?best:null}catch(_){return null}}
function rect(e,pad=7){const r=e.getBoundingClientRect(),fr=frame.getBoundingClientRect();return{x:fr.left+r.left-pad,y:fr.top+r.top-pad,w:r.width+pad*2,h:r.height+pad*2}}
function focus(e,pad=7){if(!e)return false;const r=rect(e,pad);spot.style.left=r.x+'px';spot.style.top=r.y+'px';spot.style.width=r.w+'px';spot.style.height=r.h+'px';spot.style.borderRadius=(Math.min(22,Math.max(10,(r.h*.12))))+'px';spot.classList.add('on');shade.style.opacity='.56';return true}
function clear(){spot.classList.remove('on');shade.style.opacity='0'}
function flash(){transition.classList.remove('go');void transition.offsetWidth;transition.classList.add('go')}
function scrollCenter(e){try{e.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'})}catch(_){} }
function click(e){try{if(e)e.click()}catch(_){} }
function seedDemo(){try{const w=frame.contentWindow;if(typeof w.setAppState==='function'){const now=new Date(),day=now.toISOString().slice(0,10),month=day.slice(0,7);w.setAppState({version:7,settings:{openingBalance:18500,month,dayRate:4800,nightRate:5200,scheduleMode:'legacy'},income:[{id:'demo-income',date:day,amount:98000,note:'Зарплата'}],expenses:[{id:'demo-food',date:day,amount:3250,category:'Продукты',note:'Продукты'},{id:'demo-transport',date:day,amount:1800,category:'Транспорт',note:'Транспорт'},{id:'demo-home',date:day,amount:5400,category:'Дом',note:'Дом'}],reserves:[{id:'demo-reserve',name:'Подушка безопасности',category:'Подушка безопасности',saved:18500,target:100000}],debts:[{id:'demo-debt',name:'Кредит',total:120000,paid:40000}],reserveOps:[],obligations:[{id:'demo-obligation',name:'Обязательный платёж',amount:8000,day:25,active:true}],obligationPays:[],voiceMap:[],shiftsOverride:{}})}}catch(_){} }
function normalizeApp(){try{const d=doc();d.documentElement.style.zoom='1';d.body.style.zoom='1';const overlays=[...d.querySelectorAll('.modal-bg,.onboarding,.onboard,.welcome,.intro,[class*="onboard"],[class*="welcome"]')];overlays.forEach(e=>{if(visible(e))e.style.display='none'});const scroll=d.scrollingElement||d.documentElement;scroll.scrollTop=0}catch(_){} }
const scenes=[
 {hold:4800,find:()=>first(['.hero']),prep:()=>{normalizeApp();try{(doc().scrollingElement||doc().documentElement).scrollTop=0}catch(_){}}},
 {hold:4300,find:()=>first(['.fab']),prep:()=>{normalizeApp();const e=first(['.fab']);click(e)}},
 {hold:5200,find:()=>first(['.cal']),prep:()=>{normalizeApp();const e=first(['.cal']);scrollCenter(e)}},
 {hold:5000,find:()=>first(['.list']),prep:()=>{normalizeApp();const e=first(['.list']);scrollCenter(e)}},
 {hold:5000,find:()=>{const s=section(['резерв']);if(s){click(s.querySelector('.sec-head,.sec-title'));scrollCenter(s)}return s},prep:normalizeApp},
 {hold:5000,find:()=>{const s=section(['долг','обязатель']);if(s){click(s.querySelector('.sec-head,.sec-title'));scrollCenter(s)}return s},prep:normalizeApp},
 {hold:5200,find:()=>{const s=section(['аналит','статист']);if(s){click(s.querySelector('.sec-head,.sec-title'));scrollCenter(s)}return s},prep:normalizeApp},
 {hold:4800,find:()=>first(['.finn-avatar']),prep:()=>{normalizeApp();try{(doc().scrollingElement||doc().documentElement).scrollTop=0}catch(_){}}},
 {hold:5000,find:()=>bottomNav(),prep:()=>{normalizeApp();try{(doc().scrollingElement||doc().documentElement).scrollTop=0}catch(_){} }}
];
function run(i){clearTimeout(timer);current=i;if(i>=scenes.length){clear();setTimeout(()=>{black.classList.remove('off');setTimeout(()=>location.reload(),1200)},700);return}const s=scenes[i];clear();flash();setTimeout(()=>{try{s.prep&&s.prep()}catch(_){}setTimeout(()=>{const e=s.find();if(e)focus(e,8);timer=setTimeout(()=>run(i+1),s.hold)},450)},320)}
function size(){if(innerWidth>700){const sx=innerWidth/430*.74;const sy=innerHeight/932*.96;camera.style.setProperty('--scale',Math.min(sx,sy,1));}else camera.style.setProperty('--scale','1')}
window.addEventListener('resize',size);size();
frame.addEventListener('load',()=>setTimeout(()=>{seedDemo();setTimeout(()=>{normalizeApp();black.classList.add('off');setTimeout(()=>run(0),1200)},700)},900));
</script>
</body>
</html>
