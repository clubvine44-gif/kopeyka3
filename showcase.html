<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kopeyka — Showcase</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080b}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.stage{width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,#151922 0,#0a0c11 42%,#050608 100%)}.phone{position:relative;width:min(430px,100vw);height:min(860px,100vh);background:#0A0B0E;border-radius:0;overflow:hidden;box-shadow:0 0 100px rgba(0,0,0,.7)}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0A0B0E}.spot{position:absolute;z-index:20;pointer-events:none;border-radius:18px;border:2px solid rgba(229,167,94,.95);box-shadow:0 0 0 9999px rgba(0,0,0,.54),0 0 18px rgba(229,167,94,.8),inset 0 0 18px rgba(229,167,94,.18);opacity:0;transition:left 1100ms cubic-bezier(.22,1,.36,1),top 1100ms cubic-bezier(.22,1,.36,1),width 1100ms cubic-bezier(.22,1,.36,1),height 1100ms cubic-bezier(.22,1,.36,1),opacity 700ms ease}.spot.on{opacity:1}.spot.pulse{animation:pulse 2.8s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 9999px rgba(0,0,0,.54),0 0 18px rgba(229,167,94,.75),inset 0 0 18px rgba(229,167,94,.15)}50%{box-shadow:0 0 0 9999px rgba(0,0,0,.54),0 0 34px rgba(229,167,94,1),inset 0 0 25px rgba(229,167,94,.22)}}.fade{position:absolute;inset:0;z-index:10;pointer-events:none;background:#07080b;opacity:1;transition:opacity 1000ms ease}.fade.off{opacity:0}.hide{display:none!important}@media(max-height:700px){.phone{height:100vh;width:min(390px,100vw)}}@media(min-width:700px){.phone{height:min(860px,94vh);width:min(430px,47vw);border-radius:28px}.stage{padding:3vh}.phone{box-shadow:0 25px 100px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06)}} </style></head><body><div class="stage"><div class="phone" id="phone"><iframe id="app" src="index.html?showcase=1"></iframe><div id="spot" class="spot"></div><div id="fade" class="fade"></div></div></div><script>const app=document.getElementById('app'),spot=document.getElementById('spot'),fade=document.getElementById('fade');const scenes=[{sel:'.topbar',wait:1800,dur:3600},{sel:'.hero',wait:700,dur:4000},{sel:'.fab',wait:700,dur:3000,action:()=>{const e=app.contentDocument?.querySelector('.fab');if(e&&!e.classList.contains('open'))e.click()}},{sel:'.cal',wait:500,dur:4200},{sel:'.sec',wait:500,dur:3600},{sel:'.sec',wait:300,dur:3600},{sel:'.sec',wait:300,dur:3600},{sel:'.finn-avatar',wait:500,dur:4200},{sel:'.bottom-nav,.nav',wait:500,dur:4000}];function target(el){const r=el.getBoundingClientRect(),p=app.getBoundingClientRect();return{left:r.left+p.left-5,top:r.top+p.top-5,width:r.width+10,height:r.height+10}}function pick(sel,i){const d=app.contentDocument;if(!d)return null;let es=[...d.querySelectorAll(sel)];if(sel==='.sec')es=es.filter(e=>e.offsetParent!==null);if(sel==='.sec')return es[i%Math.max(1,es.length)]||null;return es[0]||null}async function run(){await new Promise(r=>setTimeout(r,900));fade.classList.add('off');await new Promise(r=>setTimeout(r,900));for(let i=0;i<scenes.length;i++){const s=scenes[i];if(s.action)try{s.action()}catch(e){}await new Promise(r=>setTimeout(r,s.wait));let el=pick(s.sel,i);if(!el)continue;el.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});await new Promise(r=>setTimeout(r,650));let q=target(el);spot.style.left=q.left+'px';spot.style.top=q.top+'px';spot.style.width=q.width+'px';spot.style.height=q.height+'px';spot.classList.add('on','pulse');await new Promise(r=>setTimeout(r,s.dur));spot.classList.remove('pulse');}spot.classList.remove('on');await new Promise(r=>setTimeout(r,700));fade.classList.remove('off');}app.addEventListener('load',()=>{setTimeout(run,500)});</script></body></html>
