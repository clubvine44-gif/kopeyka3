<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Копейка — видео showcase</title>
<style>
:root{--gold:#e5a75e;--bg:#040507}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
#scene{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(55vw 75vh at 50% 42%,rgba(229,167,94,.07),transparent 68%),#040507}
#device{position:relative;width:min(430px,88vw);height:min(900px,calc(100vh - 28px));aspect-ratio:430/900;padding:7px;border-radius:36px;background:linear-gradient(145deg,#191b20,#0b0c0f 60%);border:1px solid rgba(255,255,255,.16);box-shadow:0 42px 120px rgba(0,0,0,.8),0 0 90px rgba(229,167,94,.055);transform:translateY(18px) scale(.985);opacity:0;animation:deviceIn 1.35s cubic-bezier(.16,1,.3,1) .15s forwards;overflow:hidden}
@keyframes deviceIn{to{transform:translateY(0) scale(1);opacity:1}}
#screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:30px;background:#0a0b0e}
iframe{display:block;width:100%;height:100%;border:0;background:#0a0b0e}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 43%,rgba(0,0,0,.42) 100%)}
#shade{position:fixed;inset:0;z-index:9;pointer-events:none;background:rgba(0,0,0,.52);opacity:0;transition:opacity .7s cubic-bezier(.22,1,.36,1)}
#spot{position:fixed;z-index:10;pointer-events:none;border:1.5px solid rgba(245,194,117,.98);border-radius:14px;opacity:0;will-change:left,top,width,height,box-shadow;transition:left 1.15s cubic-bezier(.16,1,.3,1),top 1.15s cubic-bezier(.16,1,.3,1),width 1.15s cubic-bezier(.16,1,.3,1),height 1.15s cubic-bezier(.16,1,.3,1),border-radius 1.15s cubic-bezier(.16,1,.3,1),opacity .45s ease;box-shadow:0 0 0 2px rgba(229,167,94,.08),0 0 22px rgba(229,167,94,.35),0 0 52px rgba(229,167,94,.18)}
#spot:before{content:"";position:absolute;inset:-6px;border:1px solid rgba(229,167,94,.24);border-radius:inherit;animation:ring 2.2s ease-in-out infinite}
@keyframes ring{0%,100%{transform:scale(.99);opacity:.2}50%{transform:scale(1.025);opacity:.8}}
#spot.on{opacity:1}
#spot.wide{border-radius:20px}
#flare{position:fixed;inset:0;z-index:11;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(229,167,94,.11),transparent 34%)}
#flare.go{animation:flare .95s ease}@keyframes flare{0%{opacity:0}28%{opacity:1}100%{opacity:0}}
#black{position:fixed;inset:0;z-index:30;background:#040507;opacity:1;pointer-events:none;transition:opacity 1s cubic-bezier(.4,0,.2,1)}#black.off{opacity:0}
@media(max-width:560px){#device{width:100vw;height:100vh;max-height:none;padding:0;border-radius:0;border:0;box-shadow:none}#screen{border-radius:0}}
</style>
</head>
<body>
<div id="scene"><div id="device"><div id="screen"><iframe id="app" src="index.html?showcase=1&demo=1"></iframe></div></div></div>
<div id="shade"></div><div id="spot"></div><div id="flare"></div><div id="vignette"></div><div id="black"></div>
<script>
const frame=document.getElementById('app'),spot=document.getElementById('spot'),shade=document.getElementById('shade'),flare=document.getElementById('flare'),black=document.getElementById('black');
let current=-1,timer=null;
function d(){return frame.contentDocument||frame.contentWindow.document}
function visible(e){if(!e)return false;const r=e.getBoundingClientRect();const s=getComputedStyle(e);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'}
function q(arr){for(const x of arr){try{const e=d().querySelector(x);if(visible(e))return e}catch(_){}}return null}
function byText(words){try{const all=[...d().querySelectorAll('button,a,[role="button"],.sec-head,.sec-title,.nav-item,.tab,.bottom-nav *')];return all.find(e=>visible(e)&&words.some(w=>(e.textContent||'').trim().toLowerCase().includes(w)))}catch(_){return null}}
function fixedBottom(){try{const all=[...d().querySelectorAll('*')];let best=null;for(const e of all){if(!visible(e))continue;const s=getComputedStyle(e),r=e.getBoundingClientRect();if((s.position==='fixed'||s.position==='sticky')&&r.bottom>=d().documentElement.clientHeight-8&&r.height>42&&r.width>d().documentElement.clientWidth*.65){best=e;break}}return best}catch(_){return null}}
function box(e){const r=e.getBoundingClientRect(),fr=frame.getBoundingClientRect();return{x:fr.left+r.left,y:fr.top+r.top,w:r.width,h:r.height}}
function focus(e,wide=false){if(!e)return;const r=box(e);spot.style.left=r.x+'px';spot.style.top=r.y+'px';spot.style.width=r.w+'px';spot.style.height=r.h+'px';spot.classList.toggle('wide',wide);spot.classList.add('on');shade.style.opacity='.52'}
function clearFocus(){spot.classList.remove('on');shade.style.opacity='0'}
function flash(){flare.classList.remove('go');void flare.offsetWidth;flare.classList.add('go')}
function smoothScroll(e){try{e.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'})}catch(_){} }
function demo(){try{const w=frame.contentWindow;if(typeof w.setAppState==='function'){const now=new Date(),m=now.toISOString().slice(0,7),day=now.toISOString().slice(0,10);w.setAppState({version:7,settings:{openingBalance:18500,month:m,dayRate:4800,nightRate:5200,scheduleMode:'legacy'},income:[{id:'demo-income',date:day,amount:98000,note:'Зарплата'}],expenses:[{id:'demo-food',date:day,amount:3250,category:'Продукты',note:'Продукты'},{id:'demo-transport',date:day,amount:1800,category:'Транспорт',note:'Транспорт'},{id:'demo-home',date:day,amount:5400,category:'Дом',note:'Дом'}],reserves:[{id:'demo-reserve',name:'Подушка безопасности',category:'Подушка безопасности',saved:18500,target:100000}],debts:[{id:'demo-debt',name:'Кредит',total:120000,paid:40000}],reserveOps:[],obligations:[{id:'demo-obligation',name:'Обязательный платёж',amount:8000,day:25,active:true}],obligationPays:[],voiceMap:{},shiftsOverride:{}})}}catch(_){} }
const scenes=[
 {name:'home',hold:5200,target:()=>q(['.hero'])},
 {name:'quick',hold:4300,target:()=>q(['.fab']),before:()=>{const b=q(['.fab']);if(b)b.click()}},
 {name:'calendar',hold:5600,target:()=>q(['.cal']),scroll:true},
 {name:'history',hold:5000,target:()=>q(['.list']),scroll:true},
 {name:'reserves',hold:5000,target:()=>byText(['резерв']),scroll:true},
 {name:'debts',hold:5000,target:()=>byText(['долг','обязатель']),scroll:true},
 {name:'analytics',hold:5200,target:()=>byText(['аналит','статист']),scroll:true},
 {name:'finn',hold:5200,target:()=>q(['.finn-avatar'])},
 {name:'navigation',hold:5000,target:()=>fixedBottom(),wide:true}
];
async function run(i){clearTimeout(timer);current=i;if(i>=scenes.length){clearFocus();setTimeout(()=>location.reload(),1800);return}const s=scenes[i];clearFocus();flash();setTimeout(()=>{try{if(s.before)s.before()}catch(_){}let el=s.target();if(!el&&s.name==='reserves')el=q(['.sec']);if(!el&&s.name==='debts')el=q(['.sec']);if(!el&&s.name==='analytics')el=q(['.sec']);if(s.scroll&&el)smoothScroll(el);setTimeout(()=>{el=s.target()||el;if(el)focus(el,!!s.wide);timer=setTimeout(()=>run(i+1),s.hold)},s.scroll?850:350)},250)}
frame.addEventListener('load',()=>setTimeout(()=>{demo();setTimeout(()=>{black.classList.add('off');setTimeout(()=>run(0),1100)},700)},900));
window.addEventListener('resize',()=>{if(current>=0){const s=scenes[current];const e=s.target();if(e)focus(e,!!s.wide)}});
</script>
</body>
</html>
