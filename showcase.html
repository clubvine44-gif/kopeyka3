<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Копейка — видео-превью</title>
<style>
:root{--gold:#e5a75e;--bg:#050609}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
#scene{position:fixed;inset:0;background:radial-gradient(70vw 80vh at 50% 35%,rgba(229,167,94,.055),transparent 65%),#050609;display:grid;place-items:center;overflow:hidden}
#device{position:relative;width:min(520px,100vw);height:min(100vh,980px);padding:8px;border-radius:38px;background:#0d0e12;border:1px solid rgba(255,255,255,.12);box-shadow:0 45px 120px rgba(0,0,0,.72),0 0 80px rgba(229,167,94,.05);transform:scale(.96);opacity:0;animation:deviceIn 1.2s cubic-bezier(.16,1,.3,1) .35s forwards}
@keyframes deviceIn{to{transform:scale(1);opacity:1}}
#screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:31px;background:#0a0b0e}
iframe{display:block;width:100%;height:100%;border:0;background:#0a0b0e}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.34) 100%);z-index:8}
#spot{position:fixed;z-index:10;pointer-events:none;border:1px solid rgba(229,167,94,.95);border-radius:15px;opacity:0;box-shadow:0 0 0 9999px rgba(0,0,0,.54),0 0 0 5px rgba(229,167,94,.08),0 0 42px rgba(229,167,94,.42);transition:left 1.05s cubic-bezier(.22,1,.36,1),top 1.05s cubic-bezier(.22,1,.36,1),width 1.05s cubic-bezier(.22,1,.36,1),height 1.05s cubic-bezier(.22,1,.36,1),opacity .45s}
#spot:before{content:"";position:absolute;inset:-9px;border-radius:inherit;border:1px solid rgba(229,167,94,.18);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.2}50%{transform:scale(1.035);opacity:.8}}
#spot.on{opacity:1}
#flare{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(229,167,94,.14),transparent 38%)}
#flare.go{animation:flare .8s ease}
@keyframes flare{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
#black{position:fixed;inset:0;z-index:30;background:#050609;opacity:1;pointer-events:none;transition:opacity .9s cubic-bezier(.4,0,.2,1)}
#black.off{opacity:0}
/* no controls, captions, labels or presentation chrome: this page is intentionally record-ready */
@media(max-width:560px){#device{width:100vw;height:100vh;padding:0;border-radius:0;border:0;box-shadow:none}#screen{border-radius:0}}
</style>
</head>
<body>
<div id="scene">
  <div id="device"><div id="screen"><iframe id="app" src="index.html?showcase=1&demo=1"></iframe></div></div>
</div>
<div id="black"></div><div id="spot"></div><div id="flare"></div><div id="vignette"></div>
<script>
const frame=document.getElementById('app'),spot=document.getElementById('spot'),flare=document.getElementById('flare'),black=document.getElementById('black');
let current=-1,timer;
function d(){return frame.contentDocument||frame.contentWindow.document}
function visible(el){if(!el)return false;const r=el.getBoundingClientRect();return r.width>1&&r.height>1}
function first(qs){for(const q of qs){try{const el=d().querySelector(q);if(visible(el))return el}catch(e){}}return null}
function textEl(words){const all=[...d().querySelectorAll('button,.sec-head,.sec-title,.nav-item,[role="button"]')];return all.find(el=>words.some(w=>(el.textContent||'').toLowerCase().includes(w))&&visible(el))}
function scrollToEl(el){try{el.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'})}catch(e){}}
function rect(el){const r=el.getBoundingClientRect(),fr=frame.getBoundingClientRect();return {x:fr.left+r.left,y:fr.top+r.top,w:r.width,h:r.height}}
function focus(el){if(!el)return;const r=rect(el);spot.style.left=r.x+'px';spot.style.top=r.y+'px';spot.style.width=r.w+'px';spot.style.height=r.h+'px';spot.classList.add('on')}
function transitionFlash(){flare.classList.remove('go');void flare.offsetWidth;flare.classList.add('go')}
function tap(words){const e=textEl(words);if(e){e.click();return true}return false}
function demo(){
  try{
    const w=frame.contentWindow;
    if(typeof w.setAppState==='function'){
      const t=new Date(),m=t.toISOString().slice(0,7),day=t.toISOString().slice(0,10);
      w.setAppState({version:7,settings:{openingBalance:18500,month:m,dayRate:4800,nightRate:5200,scheduleMode:'legacy'},income:[{id:'v1',date:day,amount:98000,note:'Зарплата'}],expenses:[{id:'v2',date:day,amount:1250,category:'Продукты',note:'Продукты'},{id:'v3',date:day,amount:900,category:'Проезд',note:'Проезд'}],reserves:[{id:'v4',name:'Подушка безопасности',category:'Подушка безопасности',saved:18500,target:100000}],debts:[{id:'v5',name:'Кредит',total:12000,paid:4000}],reserveOps:[],obligations:[{id:'v6',name:'Обязательный платёж',amount:8000,day:25,active:true}],obligationPays:[],voiceMap:{},shiftsOverride:{}});
    }
  }catch(e){}
}
const scenes=[
  // real app areas, no captions
  {at:1000,find:['.hero'],hold:5200},
  {at:0,find:['.fab'],tap:['+'],hold:4200,after:()=>{try{const b=d().querySelector('.fab');if(b)b.click()}catch(e){}}},
  {find:['.cal'],scroll:true,hold:5000},
  {find:['.list'],scroll:true,hold:4800},
  {find:['.sec'],scroll:true,words:['резерв','reserve'],hold:4800},
  {find:['.sec'],scroll:true,words:['долг','обяз'],hold:4800},
  {find:['.sec'],scroll:true,words:['аналит','статист'],hold:4800},
  {find:['.finn-avatar'],scroll:false,hold:5200},
  {find:['.top-actions','.icon-btn'],hold:4800}
];
async function run(i){clearTimeout(timer);current=i;if(i>=scenes.length){setTimeout(()=>location.reload(),1800);return}spot.classList.remove('on');transitionFlash();const s=scenes[i];if(s.tap)tap(s.tap);if(s.after)setTimeout(s.after,350);setTimeout(()=>{
  let el=first(s.find);if(!el&&s.words)el=textEl(s.words);if(el&&s.scroll){scrollToEl(el);setTimeout(()=>focus(el),650)}else if(el)focus(el);
  timer=setTimeout(()=>run(i+1),s.hold||4800);
},500)}
frame.addEventListener('load',()=>{setTimeout(()=>{demo();black.classList.add('off');setTimeout(()=>run(0),1100)},900)});
window.addEventListener('resize',()=>{if(current>=0){const s=scenes[current],el=first(s.find);if(el)focus(el)}});
</script>
</body>
</html>
