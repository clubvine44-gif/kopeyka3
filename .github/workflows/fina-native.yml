name: FINA Native CI
on:
  push:
    branches: [rewrite/fina-native-20261109]
    paths: ['native/**', '.github/workflows/fina-native.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Compile native Android app
        working-directory: native
        run: gradle assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fina-native-debug-preview
          path: native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
