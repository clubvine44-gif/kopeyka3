name: Release Fin 2.9.1 microphone fix

on:
  push:
    branches: [main]
    paths:
      - 'speech-silence.js'
      - 'android/app/src/main/java/app/fin/kopeyka/FinBridge.java'
      - 'android/app/build.gradle'
      - '.github/workflows/release-mic-fix.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Prepare web assets
        run: |
          set -e
          WWW="android/app/src/main/assets/www"
          mkdir -p "$WWW"
          for f in index.html app.js ai.js assistant-v2.js assistant.js cloud.js engine.js finn-wake.js voice.js onboard.js products.js sw.js manifest.json icon.svg widget.html ai-bootstrap.js speech-silence.js; do
            if [ -f "$f" ]; then cp -f "$f" "$WWW/"; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/www/index.html')
          t = p.read_text(encoding='utf-8')
          marker = '<script src="speech-silence.js?v=20260822"></script>'
          if marker not in t:
              anchor = 'assistant-v2.js?v=2026082218"></script>'
              if anchor not in t:
                  raise SystemExit('assistant-v2 script tag not found')
              t = t.replace(anchor, anchor + marker, 1)
          t = t.replace("if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=46').catch(function(){});", 'window.__FIN_NATIVE=true;')
          if 'window.__FIN_NATIVE' not in t:
              t = t.replace('<script>', '<script>window.__FIN_NATIVE=true;', 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Prepare release keystore
        env:
          FIN_KEYSTORE_BASE64: ${{ secrets.FIN_KEYSTORE_BASE64 }}
        run: |
          test -n "$FIN_KEYSTORE_BASE64" || (echo "Missing FIN_KEYSTORE_BASE64 secret" && exit 1)
          echo "$FIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fin-release.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build signed release APK
        working-directory: android
        env:
          FIN_KEYSTORE_PATH: ${{ runner.temp }}/fin-release.jks
          FIN_KEYSTORE_PASSWORD: ${{ secrets.FIN_KEYSTORE_PASSWORD }}
          FIN_KEY_ALIAS: ${{ secrets.FIN_KEY_ALIAS }}
          FIN_KEY_PASSWORD: ${{ secrets.FIN_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK version, alignment and signature
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "versionCode='18' versionName='2.9.1'"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee Fin.apk.sha256

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Fin.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.9.1" Fin.apk Fin.apk.sha256 \
            --title "Финн 2.9.1" \
            --notes "Исправлен системный звук при запуске и остановке микрофона. Остальная функциональность без изменений."

      - name: Update public update manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = {
            'versionCode': 18,
            'versionName': '2.9.1',
            'apkUrl': 'https://github.com/clubvine44-gif/kopeyka3/releases/latest/download/Fin.apk',
            'notes': 'Финн 2.9.1: убран системный звук запуска/остановки микрофона. Данные и остальные функции без изменений.'
          }
          Path('update.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m "Publish Fin 2.9.1 update manifest" || true
          git push origin HEAD:main
