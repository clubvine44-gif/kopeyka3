name: Build Kopeyka Voice

on:
  workflow_dispatch:
  push:
    paths:
      - 'voice-bridge/**'
      - '.github/workflows/build-voice-bridge.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Gradle
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        run: /tmp/gradle-8.10.2/bin/gradle --no-daemon :app:assembleDebug
        working-directory: voice-bridge
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kopeyka-voice-debug
          path: voice-bridge/app/build/outputs/apk/debug/app-debug.apk
