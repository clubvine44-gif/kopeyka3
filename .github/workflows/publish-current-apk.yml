name: Publish current Fin APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - 'ai.js'
      - 'assistant-v2.js'
      - 'assistant.js'
      - 'cloud.js'
      - 'engine.js'
      - 'finn-wake.js'
      - 'finn3d.js'
      - 'voice.js'
      - 'onboard.js'
      - 'products.js'
      - 'sw.js'
      - 'manifest.json'
      - 'icon.svg'
      - 'widget.html'
      - 'ai-bootstrap.js'
      - '.github/workflows/publish-current-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(grep -m1 -oE 'versionCode[[:space:]]+[0-9]+' android/app/build.gradle | awk '{print $2}')
          VERSION_NAME=$(grep -m1 -oE 'versionName[[:space:]]+"[^"]+"' android/app/build.gradle | sed -E 's/versionName[[:space:]]+"([^"]+)"/\1/')
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Publishing Fin $VERSION_NAME ($VERSION_CODE)"

      - name: Check whether release already exists
        id: release_exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.release_exists.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.release_exists.outputs.exists != 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        if: steps.release_exists.outputs.exists != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Prepare web assets
        if: steps.release_exists.outputs.exists != 'true'
        run: |
          set -euo pipefail
          WWW="android/app/src/main/assets/www"
          mkdir -p "$WWW"
          for f in index.html app.js ai.js assistant-v2.js assistant.js cloud.js engine.js finn-wake.js finn3d.js voice.js onboard.js products.js sw.js manifest.json icon.svg widget.html ai-bootstrap.js; do
            if [ -f "$f" ]; then cp -f "$f" "$WWW/"; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/www/index.html')
          if p.exists():
              t = p.read_text(encoding='utf-8')
              t = t.replace("if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=46').catch(function(){});", 'window.__FIN_NATIVE=true;')
              if 'window.__FIN_NATIVE' not in t:
                  t = t.replace('<script>', '<script>window.__FIN_NATIVE=true;', 1)
              p.write_text(t, encoding='utf-8')
          PY

      - name: Prepare release keystore
        if: steps.release_exists.outputs.exists != 'true'
        env:
          FIN_KEYSTORE_BASE64: ${{ secrets.FIN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIN_KEYSTORE_BASE64" || { echo 'Missing FIN_KEYSTORE_BASE64'; exit 1; }
          echo "$FIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fin-release.jks"
          test -s "$RUNNER_TEMP/fin-release.jks"

      - name: Setup Gradle
        if: steps.release_exists.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build signed release APK
        if: steps.release_exists.outputs.exists != 'true'
        working-directory: android
        env:
          FIN_KEYSTORE_PATH: ${{ runner.temp }}/fin-release.jks
          FIN_KEYSTORE_PASSWORD: ${{ secrets.FIN_KEYSTORE_PASSWORD }}
          FIN_KEY_ALIAS: ${{ secrets.FIN_KEY_ALIAS }}
          FIN_KEY_PASSWORD: ${{ secrets.FIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FIN_KEYSTORE_PASSWORD"
          test -n "$FIN_KEY_ALIAS"
          test -n "$FIN_KEY_PASSWORD"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare and validate APK
        if: steps.release_exists.outputs.exists != 'true'
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk Fin.apk
          test -s Fin.apk
          BUILD_TOOLS="$(find "${ANDROID_HOME:-/nonexistent}" "${ANDROID_SDK_ROOT:-/nonexistent}" /usr/local/lib/android/sdk -maxdepth 3 -type d -path '*build-tools/34.0.0' 2>/dev/null | head -n1)"
          if [ -z "$BUILD_TOOLS" ]; then
            BUILD_TOOLS="$(find / -maxdepth 8 -type d -path '*build-tools/34.0.0' 2>/dev/null | head -n1)"
          fi
          test -n "$BUILD_TOOLS" || { echo "build-tools 34.0.0 not found"; exit 1; }
          echo "Using build-tools at: $BUILD_TOOLS"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$ZIPALIGN" || { echo "zipalign not executable at $ZIPALIGN"; exit 1; }
          test -x "$APKSIGNER" || { echo "apksigner not executable at $APKSIGNER"; exit 1; }
          # Gradle уже зип-алайнит и подписывает release APK (v2/v3) при сборке.
          # Повторный zipalign после подписи ломает блок подписи — поэтому НЕ прогоняем его снова,
          # только проверяем, что итоговый APK уже выровнен и подпись валидна.
          "$ZIPALIGN" -c -p -v 4 Fin.apk
          "$APKSIGNER" verify --verbose Fin.apk
          ls -lh Fin.apk

      - name: Publish GitHub Release
        if: steps.release_exists.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          gh release create "$TAG" Fin.apk \
            --title "Финн $VERSION_NAME" \
            --notes "Финн $VERSION_NAME (versionCode $VERSION_CODE). Подписанный APK."
