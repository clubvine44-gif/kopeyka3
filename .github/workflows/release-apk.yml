name: Release Fin APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Версия, например 1.1.0 (при ручном запуске; при push берётся из build.gradle)'
        required: false
        type: string
      version_code:
        description: 'Числовой versionCode, например 2 (при ручном запуске; при push берётся из build.gradle)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION_NAME" ] && [ -n "$INPUT_VERSION_CODE" ]; then
            VERSION_NAME="$INPUT_VERSION_NAME"
            VERSION_CODE="$INPUT_VERSION_CODE"
          else
            VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
            VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)
          fi
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "RELEASE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Releasing $VERSION_NAME ($VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Prepare web assets
        run: |
          set -euo pipefail
          WWW="android/app/src/main/assets/www"
          mkdir -p "$WWW"
          for f in index.html app.js ai.js assistant-v2.js assistant.js cloud.js engine.js fin-core.js finn-char.js finn3d.js finn-wake.js matter.js matter-finn.js matter-room.jpg matter-room.mp3 matter-tour-1.mp3 matter-tour-2.mp3 matter-tour-3.mp3 matter-tour-4.mp3 matter-tour-5.mp3 voice.js onboard.js profile.js products.js sw.js manifest.json icon.svg widget.html ai-bootstrap.js; do
            if [ -f "$f" ]; then cp -f "$f" "$WWW/"; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/www/index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace("if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=46').catch(function(){});", 'window.__FIN_NATIVE=true;')
          if 'window.__FIN_NATIVE' not in t:
              t = t.replace('<script>', '<script>window.__FIN_NATIVE=true;', 1)
          p.write_text(t, encoding='utf-8')
          PY
          for f in matter.js matter-tour-1.mp3 matter-tour-2.mp3 matter-tour-3.mp3 matter-tour-4.mp3 matter-tour-5.mp3; do
            test -f "$WWW/$f" || { echo "Missing packaged asset: $f"; exit 1; }
          done

      - name: Set version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          t = p.read_text()
          t = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ['RELEASE_VERSION_CODE'], t, count=1)
          t = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ['RELEASE_VERSION_NAME'] + '"', t, count=1)
          p.write_text(t)
          PY

      - name: Prepare release keystore
        env:
          FIN_KEYSTORE_BASE64: ${{ secrets.FIN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIN_KEYSTORE_BASE64" || { echo "Missing FIN_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$FIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fin-release.jks"
          test -s "$RUNNER_TEMP/fin-release.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build signed release APK
        working-directory: android
        env:
          FIN_KEYSTORE_PATH: ${{ runner.temp }}/fin-release.jks
          FIN_KEYSTORE_PASSWORD: ${{ secrets.FIN_KEYSTORE_PASSWORD }}
          FIN_KEY_ALIAS: ${{ secrets.FIN_KEY_ALIAS }}
          FIN_KEY_PASSWORD: ${{ secrets.FIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FIN_KEYSTORE_PASSWORD"
          test -n "$FIN_KEY_ALIAS"
          test -n "$FIN_KEY_PASSWORD"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Validate APK
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk Fin.apk
          test -s Fin.apk
          BUILD_TOOLS="$(find "${ANDROID_HOME:-/nonexistent}" "${ANDROID_SDK_ROOT:-/nonexistent}" /usr/local/lib/android/sdk -maxdepth 3 -type d -path '*build-tools/34.0.0' 2>/dev/null | head -n1)"
          test -n "$BUILD_TOOLS" || { echo "build-tools 34.0.0 not found"; exit 1; }
          "$BUILD_TOOLS/zipalign" -c -p -v 4 Fin.apk
          "$BUILD_TOOLS/apksigner" verify --verbose Fin.apk
          sha256sum Fin.apk | tee Fin.apk.sha256
          ls -lh Fin.apk Fin.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Fin.apk Fin.apk.sha256 --clobber
          else
            gh release create "$TAG" Fin.apk Fin.apk.sha256 --title "Финн ${RELEASE_VERSION_NAME}" --notes "Подписанный APK Финна ${RELEASE_VERSION_NAME} (versionCode ${RELEASE_VERSION_CODE})."
          fi

      - name: Update public update manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          vn = os.environ['RELEASE_VERSION_NAME']
          vc = int(os.environ['RELEASE_VERSION_CODE'])
          data = {
            'versionCode': vc,
            'versionName': vn,
            'apkUrl': f'https://github.com/clubvine44-gif/kopeyka3/releases/download/v{vn}/Fin.apk',
            'notes': f'{vn} — исправления ядра, упаковки Android и стабильности релиза (versionCode {vc})'
          }
          Path('update.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m "Update Fin release manifest to ${RELEASE_VERSION_NAME}" || true
          git push origin HEAD:main
