name: Release Fin APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Версия, например 1.1.0'
        required: true
        type: string
      version_code:
        description: 'Числовой versionCode, например 2'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Prepare web assets
        run: |
          set -e
          WWW="android/app/src/main/assets/www"
          mkdir -p "$WWW"
          for f in index.html app.js ai.js assistant-v2.js assistant.js cloud.js engine.js finn-wake.js finn3d.js voice.js onboard.js products.js sw.js manifest.json icon.svg widget.html ai-bootstrap.js; do
            if [ -f "$f" ]; then cp -f "$f" "$WWW/"; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/www/index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace("if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=46').catch(function(){});", 'window.__FIN_NATIVE=true;')
          if 'window.__FIN_NATIVE' not in t:
              t = t.replace('<script>', '<script>window.__FIN_NATIVE=true;', 1)
          p.write_text(t, encoding='utf-8')
          PY

      - name: Set version
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          t = p.read_text()
          t = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ['VERSION_CODE'], t, count=1)
          t = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ['VERSION_NAME'] + '"', t, count=1)
          p.write_text(t)
          PY

      - name: Prepare release keystore
        env:
          FIN_KEYSTORE_BASE64: ${{ secrets.FIN_KEYSTORE_BASE64 }}
        run: |
          test -n "$FIN_KEYSTORE_BASE64" || (echo "Missing FIN_KEYSTORE_BASE64 secret" && exit 1)
          echo "$FIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fin-release.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build signed release APK
        working-directory: android
        env:
          FIN_KEYSTORE_PATH: ${{ runner.temp }}/fin-release.jks
          FIN_KEYSTORE_PASSWORD: ${{ secrets.FIN_KEYSTORE_PASSWORD }}
          FIN_KEY_ALIAS: ${{ secrets.FIN_KEY_ALIAS }}
          FIN_KEY_PASSWORD: ${{ secrets.FIN_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Fin.apk"
          ls -lh Fin.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          gh release create "v${VERSION_NAME}" Fin.apk --title "Финн ${VERSION_NAME}" --notes "Обновление Финна ${VERSION_NAME}"

      - name: Update public update manifest
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {
            'versionCode': int(os.environ['VERSION_CODE']),
            'versionName': os.environ['VERSION_NAME'],
            'apkUrl': 'https://github.com/clubvine44-gif/kopeyka3/releases/latest/download/Fin.apk',
            'notes': 'Новая версия Финна'
          }
          Path('update.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m "Update Fin release manifest to ${{ inputs.version_name }}" || true
          git push origin HEAD:main
