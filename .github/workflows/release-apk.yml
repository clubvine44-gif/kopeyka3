name: Release Fin APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'update.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Update Fin release manifest') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check cash / cloud / meal logic
        run: node tools/check-logic.cjs
      - name: Determine version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)
          test -n "$VERSION_NAME"; test -n "$VERSION_CODE"
          echo "RELEASE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Accept Android licenses
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          mkdir -p "$SDK/licenses"
          printf '%s\n' '24333f8a63b6825ea9c5514f21c17bae089c7cd3' 'd56f5187479451eabf01fb78af6dfcb131a6481e' '24333f8a63b6825ea9c5514f21c17bae089c7cd3' > "$SDK/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646161da1e653efbec703a' > "$SDK/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
      - name: Prepare web assets
        run: |
          set -euo pipefail
          WWW="android/app/src/main/assets/www"
          mkdir -p "$WWW"
          # Restore full index if broken/short
          GOOD_INDEX_SHA="2c61a4967597c6d225a7946b2f9b5fee1f0649a7"
          if [ ! -f "$WWW/index.html" ] || [ $(wc -c < "$WWW/index.html") -lt 20000 ]; then
            echo "Restoring full index.html from $GOOD_INDEX_SHA"
            curl -fsSL "https://raw.githubusercontent.com/clubvine44-gif/kopeyka3/${GOOD_INDEX_SHA}/android/app/src/main/assets/www/index.html" -o "$WWW/index.html"
          fi
          if [ -f "$WWW/app.js" ] && [ $(wc -c < "$WWW/app.js") -gt 50000 ]; then
            cp -f "$WWW/app.js" /tmp/good-app.js
          fi
          for f in index.html app.js ai.js assistant-v2.js assistant.js cloud.js engine.js fin-core.js fin-plan.js fin-design.js secure-store.js fin-backup.js finn-char.js finn3d.js finn-wake.js matter.js matter-finn.js matter-room.jpg matter-room.mp3 matter-voice-1.mp3 matter-voice-2.mp3 matter-voice-3.mp3 matter-voice-4.mp3 matter-voice-5.mp3 voice.js onboard.js profile.js products.js sw.js manifest.json icon.svg widget.html ai-bootstrap.js budget-carry.js meal-plan.js; do
            if [ -f "$f" ]; then cp -f "$f" "$WWW/"; fi
          done
          # If root index overwrote with short file, restore again
          if [ $(wc -c < "$WWW/index.html") -lt 20000 ]; then
            curl -fsSL "https://raw.githubusercontent.com/clubvine44-gif/kopeyka3/${GOOD_INDEX_SHA}/android/app/src/main/assets/www/index.html" -o "$WWW/index.html"
          fi
          if [ -f /tmp/good-app.js ]; then
            if [ ! -f app.js ] || [ $(wc -c < app.js) -lt 20000 ]; then cp -f /tmp/good-app.js "$WWW/app.js"; fi
          fi
          for f in matter.js fin-plan.js fin-design.js budget-carry.js meal-plan.js; do
            test -f "$WWW/$f" || { echo "Missing $f"; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/assets/www/index.html')
          t=p.read_text(encoding='utf-8')
          assert len(t) > 20000, 'index still too small'
          t=re.sub(r"if\(!window\.__FIN_NATIVE&&'serviceWorker' in navigator\)navigator\.serviceWorker\.register\('sw\.js\?v=\d+'\)\.catch\(function\(\)\{\}\);", '', t)
          t=re.sub(r"if\('serviceWorker' in navigator\)navigator\.serviceWorker\.register\('sw\.js\?v=\d+'\)\.catch\(function\(\)\{\}\);", '', t)
          if 'window.__FIN_NATIVE=true' not in t:
              t=t.replace('window.__FIN_NATIVE=!!(window.FinBridge);','window.__FIN_NATIVE=true;',1)
          # inject budget-carry if missing
          if 'budget-carry.js' not in t and 'app.js' in t:
              t=re.sub(r'(<script src="app\.js[^"]*"></script>)', r'\1<script src="budget-carry.js?v=2026091720"></script>', t, count=1)
          # inject meal-plan after budget-carry or app.js
          if 'meal-plan.js' not in t:
              if 'budget-carry.js' in t:
                  t=re.sub(r'(<script src="budget-carry\.js[^"]*"></script>)', r'\1<script src="meal-plan.js?v=2026091720"></script>', t, count=1)
              elif 'app.js' in t:
                  t=re.sub(r'(<script src="app\.js[^"]*"></script>)', r'\1<script src="meal-plan.js?v=2026091720"></script>', t, count=1)
          assert 'meal-plan.js' in t, 'meal-plan script not injected'
          p.write_text(t, encoding='utf-8')
          print('index bytes', len(t), 'meal-plan ok')
          PY
      - name: Set version
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('android/app/build.gradle'); t=p.read_text()
          t=re.sub(r'versionCode\s+\d+','versionCode '+os.environ['RELEASE_VERSION_CODE'],t,count=1)
          t=re.sub(r'versionName\s+"[^"]+"','versionName "'+os.environ['RELEASE_VERSION_NAME']+'"',t,count=1)
          p.write_text(t)
          PY
      - name: Prepare release keystore
        env:
          FIN_KEYSTORE_BASE64: ${{ secrets.FIN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FIN_KEYSTORE_BASE64"
          echo "$FIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fin-release.jks"
          test -s "$RUNNER_TEMP/fin-release.jks"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Build signed release APK
        working-directory: android
        env:
          FIN_KEYSTORE_PATH: ${{ runner.temp }}/fin-release.jks
          FIN_KEYSTORE_PASSWORD: ${{ secrets.FIN_KEYSTORE_PASSWORD }}
          FIN_KEY_ALIAS: ${{ secrets.FIN_KEY_ALIAS }}
          FIN_KEY_PASSWORD: ${{ secrets.FIN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle assembleRelease --no-daemon --stacktrace
      - name: Validate APK
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk Fin.apk
          test -s Fin.apk
          BUILD_TOOLS="$(find "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk -maxdepth 3 -type d -path '*build-tools/34.0.0' 2>/dev/null | head -n1)"
          test -n "$BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -c -p -v 4 Fin.apk
          "$BUILD_TOOLS/apksigner" verify --verbose Fin.apk
          unzip -p Fin.apk assets/www/index.html | grep -q 'meal-plan.js' || { echo 'meal-plan not in index'; exit 1; }
          unzip -l Fin.apk | grep -E 'assets/www/(fin-plan|meal-plan)\.js'
          sha256sum Fin.apk | tee Fin.apk.sha256
          ls -lh Fin.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION_NAME}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          timeout 120 gh release create "$TAG" Fin.apk Fin.apk.sha256 \
            --title "Финн ${RELEASE_VERSION_NAME}" \
            --notes "APK ${RELEASE_VERSION_NAME} (versionCode ${RELEASE_VERSION_CODE}). Касса: параллельные сохранения не затирают последнюю операцию, якорь облака пересчитывается, рацион в JSON-копии." \
            --repo "${{ github.repository }}"
      - name: Update public update manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          vn=os.environ['RELEASE_VERSION_NAME']; vc=int(os.environ['RELEASE_VERSION_CODE'])
          sha=Path('Fin.apk.sha256').read_text(encoding='utf-8').split()[0].strip()
          Path('update.json').write_text(json.dumps({
              'versionCode':vc,
              'versionName':vn,
              'apkUrl':f'https://github.com/clubvine44-gif/kopeyka3/releases/download/v{vn}/Fin.apk',
              'sha256':sha,
              'notes':f'{vn} — сохранность кассы: последняя операция не затирается, якорь облака сходится, рацион в копии (versionCode {vc})'
          },ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git commit -m "Update Fin release manifest to ${RELEASE_VERSION_NAME}" || true
          git push origin HEAD:main
