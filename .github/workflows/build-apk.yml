name: Build Fin APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - 'ai.js'
      - 'assistant-v2.js'
      - 'assistant.js'
      - 'cloud.js'
      - 'engine.js'
      - 'finn-char.js'
      - 'finn3d.js'
      - 'finn-wake.js'
      - 'matter.js'
      - 'voice.js'
      - 'onboard.js'
      - 'products.js'
      - 'sw.js'
      - 'manifest.json'
      - 'icon.svg'
      - 'widget.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Prepare web assets into Android
        run: |
          set -e
          WWW="android/app/src/main/assets/www"
          mkdir -p "$WWW"
          for f in index.html app.js ai.js assistant-v2.js assistant.js cloud.js engine.js finn-char.js finn3d.js finn-wake.js matter.js voice.js onboard.js profile.js products.js sw.js manifest.json icon.svg widget.html ai-bootstrap.js; do
            if [ -f "$f" ]; then cp -f "$f" "$WWW/"; fi
          done
          if [ -f "$WWW/index.html" ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/www/index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace("if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=46').catch(function(){});", 'window.__FIN_NATIVE=true;')
          if 'window.__FIN_NATIVE' not in t:
              t = t.replace('<script>', '<script>window.__FIN_NATIVE=true;', 1)
          p.write_text(t, encoding='utf-8')
          print('index patched')
          PY
          fi
          echo "Assets:"
          ls -la "$WWW"

      - name: PNG launcher icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from struct import pack
          import zlib

          def write_png(path, w, h, rgba):
              def chunk(tag, data):
                  return pack('>I', len(data)) + tag + data + pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              raw = b''
              for y in range(h):
                  raw += b'\x00' + bytes(rgba) * w
              data = chunk(b'IHDR', pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0))
              data += chunk(b'IDAT', zlib.compress(raw, 9))
              data += chunk(b'IEND', b'')
              Path(path).write_bytes(b'\x89PNG\r\n\x1a\n' + data)

          base = Path('android/app/src/main/res')
          for dens, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              d = base / f'mipmap-{dens}'
              d.mkdir(parents=True, exist_ok=True)
              write_png(d / 'ic_launcher.png', size, size, (229, 167, 94, 255))
          print('icons ok')
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" Fin-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fin-APK
          path: Fin-debug.apk
          if-no-files-found: error
          retention-days: 30
