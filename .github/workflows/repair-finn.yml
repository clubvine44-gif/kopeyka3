name: Repair Fin app state and AI defaults
# Retired: the old job overwrote app.js from a historic commit and could wipe
# current cash-safety fixes. Keep the file for history; do not auto-run.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: |
          echo "This workflow is retired. Cash/data repairs live in app.js, cloud.js, assistant-v2.js."
          echo "Use release-apk.yml to publish a new signed APK."
          exit 0
