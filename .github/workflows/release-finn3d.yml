name: Release Finn 3D Update

on:
  push:
    branches: [main]
    paths-ignore: [update.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Prepare web assets
        run: |
          set -e
          WWW="android/app/src/main/assets/www"
          mkdir -p "$WWW"
          for f in index.html app.js ai.js assistant-v2.js assistant.js cloud.js engine.js finn-wake.js finn3d.js voice.js onboard.js products.js sw.js manifest.json icon.svg widget.html ai-bootstrap.js; do
            [ -f "$f" ] && cp -f "$f" "$WWW/" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/assets/www/index.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace("if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=46').catch(function(){});",'window.__FIN_NATIVE=true;')
          if 'window.__FIN_NATIVE' not in t:t=t.replace('<script>','<script>window.__FIN_NATIVE=true;',1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Read release version from build.gradle
        run: |
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path
          t=Path('android/app/build.gradle').read_text()
          code=re.search(r'versionCode\s+(\d+)',t).group(1)
          name=re.search(r'versionName\s+"([^"]+)"',t).group(1)
          print(f'Building Finn {name} (versionCode {code})')
          with open('/tmp/ver.env','w') as f:
              f.write(f'VERSION_CODE={code}\nVERSION_NAME={name}\n')
          PY
          cat /tmp/ver.env >> "$GITHUB_ENV"
          cp /tmp/ver.env "$RUNNER_TEMP/ver.env"

      - name: Prepare release keystore
        env:
          FIN_KEYSTORE_BASE64: ${{ secrets.FIN_KEYSTORE_BASE64 }}
        run: |
          test -n "$FIN_KEYSTORE_BASE64" || (echo "Missing FIN_KEYSTORE_BASE64 secret" && exit 1)
          echo "$FIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fin-release.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build signed release APK
        working-directory: android
        env:
          FIN_KEYSTORE_PATH: ${{ runner.temp }}/fin-release.jks
          FIN_KEYSTORE_PASSWORD: ${{ secrets.FIN_KEYSTORE_PASSWORD }}
          FIN_KEY_ALIAS: ${{ secrets.FIN_KEY_ALIAS }}
          FIN_KEY_PASSWORD: ${{ secrets.FIN_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK version, alignment and signature
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          AAPT="$BUILD_TOOLS/aapt"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -f "$APK"
          test -x "$AAPT"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          INFO="$($AAPT dump badging "$APK")"
          echo "$INFO"
          CODE=$(printf '%s\n' "$INFO" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          NAME=$(printf '%s\n' "$INFO" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "APK versionCode=$CODE versionName=$NAME (expected $VERSION_CODE / $VERSION_NAME)"
          test "$CODE" = "$VERSION_CODE"
          test "$NAME" = "$VERSION_NAME"

          echo "Checking zip alignment..."
          "$ZIPALIGN" -c -p -v 4 "$APK"

          echo "Checking APK signature..."
          "$APKSIGNER" verify --verbose "$APK"

          echo "APK SHA256:"
          sha256sum "$APK"

      - name: Preserve verified APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Fin.apk"

      - name: Clean generated files
        run: |
          git reset --hard HEAD
          git clean -fdx android/.gradle android/app/build android/app/src/main/assets Fin.apk

      - name: Refresh repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Update public update manifest
        run: |
          set -e
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          code=int(os.environ['VERSION_CODE'])
          name=os.environ['VERSION_NAME']
          Path('update.json').write_text(json.dumps({
            'versionCode': code,
            'versionName': name,
            'apkUrl': f'https://github.com/clubvine44-gif/kopeyka3/releases/download/v{name}/Fin.apk',
            'notes': f'Финн {name}: 3D-ассистент, обучение и визуальная навигация.'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          if git diff --cached --quiet; then echo 'update.json already current'; else git commit -m "Publish Finn ${VERSION_NAME} update manifest"; git push origin HEAD:main; fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp "$RUNNER_TEMP/Fin.apk" Fin.apk
          TAG="v${VERSION_NAME}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git fetch origin main
          gh release create "$TAG" Fin.apk \
            --target "$(git rev-parse origin/main)" \
            --title "Финн ${VERSION_NAME}" \
            --notes "3D Финн, обучение, визуальная навигация и обновления."
