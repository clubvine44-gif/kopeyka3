name: Release Finn 3D Update

on:
  push:
    branches: [main]
    paths-ignore: [update.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Prepare web assets
        run: |
          set -e
          WWW="android/app/src/main/assets/www"
          mkdir -p "$WWW"
          for f in index.html app.js ai.js assistant-v2.js assistant.js cloud.js engine.js finn-wake.js finn3d.js voice.js onboard.js products.js sw.js manifest.json icon.svg widget.html ai-bootstrap.js; do
            [ -f "$f" ] && cp -f "$f" "$WWW/" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/assets/www/index.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace("if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=46').catch(function(){});",'window.__FIN_NATIVE=true;')
          if 'window.__FIN_NATIVE' not in t:t=t.replace('<script>','<script>window.__FIN_NATIVE=true;',1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Set release version from build.gradle
        run: |
          set -e
          CODE=$(python3 -c "import re; t=open('android/app/build.gradle').read(); print(re.search(r'versionCode\\s+(\\d+)', t).group(1))")
          NAME=$(python3 -c "import re; t=open('android/app/build.gradle').read(); print(re.search(r'versionName\\s+\"([^\"]+)\"', t).group(1))")
          echo "VERSION_CODE=$CODE" > "$RUNNER_TEMP/ver.env"
          echo "VERSION_NAME=$NAME" >> "$RUNNER_TEMP/ver.env"
          cat "$RUNNER_TEMP/ver.env"

      - name: Prepare release keystore
        env:
          FIN_KEYSTORE_BASE64: ${{ secrets.FIN_KEYSTORE_BASE64 }}
        run: |
          test -n "$FIN_KEYSTORE_BASE64" || (echo "Missing FIN_KEYSTORE_BASE64 secret" && exit 1)
          echo "$FIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fin-release.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build signed release APK
        working-directory: android
        env:
          FIN_KEYSTORE_PATH: ${{ runner.temp }}/fin-release.jks
          FIN_KEYSTORE_PASSWORD: ${{ secrets.FIN_KEYSTORE_PASSWORD }}
          FIN_KEY_ALIAS: ${{ secrets.FIN_KEY_ALIAS }}
          FIN_KEY_PASSWORD: ${{ secrets.FIN_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK version
        run: |
          set -e
          source "$RUNNER_TEMP/ver.env"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKANALYZER=$(find "$ANDROID_HOME" -type f -name apkanalyzer -perm -111 | head -1 || true)
          test -n "$APKANALYZER"
          CODE=$($APKANALYZER manifest version-code "$APK")
          NAME=$($APKANALYZER manifest version-name "$APK")
          echo "APK versionCode=$CODE versionName=$NAME (expected $VERSION_CODE / $VERSION_NAME)"
          test "$CODE" = "$VERSION_CODE"
          echo "$NAME" | grep -F "$VERSION_NAME"
          sha256sum "$APK"

      - name: Preserve verified APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Fin.apk"

      - name: Clean generated files
        run: |
          git reset --hard HEAD
          git clean -fdx android/.gradle android/app/build android/app/src/main/assets Fin.apk

      - name: Refresh repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Update public update manifest
        run: |
          set -e
          source "$RUNNER_TEMP/ver.env"
          python3 -c "
          import json
          from pathlib import Path
          code=int('${VERSION_CODE}'); name='${VERSION_NAME}'
          Path('update.json').write_text(json.dumps({
            'versionCode': code,
            'versionName': name,
            'apkUrl': f'https://github.com/clubvine44-gif/kopeyka3/releases/download/v{name}/Fin.apk',
            'notes': f'Финн {name}: 3D-ассистент, обучение, мгновенные обновления.'
          }, ensure_ascii=False, indent=2)+chr(10), encoding='utf-8')
          print('update.json', code, name)
          "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          if git diff --cached --quiet; then echo 'update.json already current'; else git commit -m "Publish Finn update manifest"; git push origin HEAD:main; fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          source "$RUNNER_TEMP/ver.env"
          cp "$RUNNER_TEMP/Fin.apk" Fin.apk
          TAG="v${VERSION_NAME}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git fetch origin main
          gh release create "$TAG" Fin.apk \
            --target "$(git rev-parse origin/main)" \
            --title "Финн ${VERSION_NAME}" \
            --notes "3D Финн, обучение, мгновенные предложения обновлений."
