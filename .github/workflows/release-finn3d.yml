name: Release Finn 3D Update

on:
  push:
    branches: [main]
    paths-ignore: [update.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Prepare web assets
        run: |
          set -e
          WWW="android/app/src/main/assets/www"
          mkdir -p "$WWW"
          for f in index.html app.js ai.js assistant-v2.js assistant.js cloud.js engine.js finn-wake.js finn3d.js voice.js onboard.js products.js sw.js manifest.json icon.svg widget.html ai-bootstrap.js; do
            [ -f "$f" ] && cp -f "$f" "$WWW/" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/assets/www/index.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace("if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=46').catch(function(){});",'window.__FIN_NATIVE=true;')
          if 'window.__FIN_NATIVE' not in t:t=t.replace('<script>','<script>window.__FIN_NATIVE=true;',1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Set release version
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('android/app/build.gradle')
          t=p.read_text()
          t=re.sub(r'versionCode\s+\d+','versionCode 7',t,count=1)
          t=re.sub(r'versionName\s+"[^"]+"','versionName "2.0.0"',t,count=1)
          p.write_text(t)
          PY

      - name: Prepare release keystore
        env:
          FIN_KEYSTORE_BASE64: ${{ secrets.FIN_KEYSTORE_BASE64 }}
        run: |
          test -n "$FIN_KEYSTORE_BASE64" || (echo "Missing FIN_KEYSTORE_BASE64 secret" && exit 1)
          echo "$FIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fin-release.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build signed release APK
        working-directory: android
        env:
          FIN_KEYSTORE_PATH: ${{ runner.temp }}/fin-release.jks
          FIN_KEYSTORE_PASSWORD: ${{ secrets.FIN_KEYSTORE_PASSWORD }}
          FIN_KEY_ALIAS: ${{ secrets.FIN_KEY_ALIAS }}
          FIN_KEY_PASSWORD: ${{ secrets.FIN_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK is really 2.0.0
        run: |
          set -e
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$APKANALYZER" ]; then
            APKANALYZER=$(find "$ANDROID_HOME" -type f -name apkanalyzer -perm -111 | head -1 || true)
          fi
          test -n "$APKANALYZER" && test -x "$APKANALYZER"
          INFO="$($APKANALYZER manifest application-id "$APK" && $APKANALYZER manifest version-code "$APK" && $APKANALYZER manifest version-name "$APK")"
          echo "$INFO"
          echo "$INFO" | grep -Eq '7|2\.0\.0'
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK SHA256=$SHA"

      - name: Preserve verified APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Fin.apk"

      - name: Clean generated files
        run: |
          git reset --hard HEAD
          git clean -fdx android/.gradle android/app/build android/app/src/main/assets Fin.apk

      - name: Refresh repository
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Update public update manifest
        run: |
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('update.json').write_text(json.dumps({
            'versionCode':7,
            'versionName':'2.0.0',
            'apkUrl':'https://github.com/clubvine44-gif/kopeyka3/releases/download/v2.0.0/Fin.apk',
            'notes':'Финн 2.0.0: рабочий 3D-ассистент, анимация, обучение и визуальное указание на элементы интерфейса.'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          if git diff --cached --quiet; then echo 'update.json already current'; else git commit -m 'Publish Finn 2.0.0 update manifest'; git push origin HEAD:main; fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp "$RUNNER_TEMP/Fin.apk" Fin.apk
          gh release delete v2.0.0 --yes 2>/dev/null || true
          git push --delete origin v2.0.0 2>/dev/null || true
          git tag -d v2.0.0 2>/dev/null || true
          git fetch origin main
          gh release create v2.0.0 Fin.apk \
            --target "$(git rev-parse origin/main)" \
            --title "Финн 2.0.0 — 3D ассистент" \
            --notes "Рабочий 3D Финн, анимация, интерактивное обучение и визуальное указание на элементы интерфейса."
