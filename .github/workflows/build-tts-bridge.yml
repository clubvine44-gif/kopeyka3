name: Build Kopeyka TTS Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-tts-bridge/**'
      - '.github/workflows/build-tts-bridge.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tts-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kopeyka-tts-bridge-debug
          path: android-tts-bridge/app/build/outputs/apk/debug/app-debug.apk
