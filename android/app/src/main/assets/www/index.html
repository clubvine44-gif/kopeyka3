<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0A0B0E"><title>Финна</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{
  --bg:#0B1220;
  --bg2:#0E1628;
  --card:rgba(17,26,45,.82);
  --card2:rgba(21,32,54,.9);
  --glass:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.12);
  --line2:rgba(120,180,255,.18);
  --text:#E8F0FF;
  --muted:#8BA0C0;
  --accent:#5EC8FF;
  --gold:#F0C060;
  --green:#4ADE80;
  --red:#F87171;
  --blue:#60A5FA;
  --radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --nav-h:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.4;overflow-x:hidden}
body{
  padding-top:var(--safe-t);
  padding-bottom:calc(84px + var(--safe-b));
  background:
    radial-gradient(ellipse 120% 80% at 50% -20%,rgba(40,90,180,.25),transparent 50%),
    radial-gradient(ellipse 80% 50% at 100% 50%,rgba(20,60,140,.12),transparent 40%),
    linear-gradient(180deg,#0A101C 0%,#0B1220 40%,#0E1628 100%);
  min-height:100%;
}
button,input,select{font:inherit;color:inherit;border:none;outline:none;background:none;cursor:pointer}

/* Topbar glass */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;
  background:rgba(9,14,25,.94);
  border-bottom:1px solid var(--line);
  gap:8px;
}
.top-left{flex:0 0 auto;width:56px;display:flex;align-items:center}
.top-title{
  flex:1;text-align:center;font-weight:700;font-size:17px;letter-spacing:.02em;
  color:var(--text);opacity:.95;
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:0;cursor:pointer;user-select:none;-webkit-user-select:none;
  padding:2px 8px;border-radius:12px;
}
.top-title:active{background:rgba(255,255,255,.06)}
.top-title .tt-name{display:flex;align-items:center;gap:5px;line-height:1.15}
.top-title .tt-chev{font-size:10px;opacity:.55;transition:transform .2s}
.top-title.open .tt-chev{transform:rotate(180deg);opacity:.9}
.top-title .tt-model{
  font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--muted);
  margin-top:1px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.model-menu{
  position:fixed;top:56px;left:50%;transform:translateX(-50%);
  width:min(300px,calc(100vw - 24px));max-width:calc(100vw - 24px);z-index:200;
  background:rgba(14,22,40,.98);border:1px solid rgba(120,180,255,.28);
  border-radius:16px;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.55);
  display:none;text-align:left;
  max-height:min(70vh,480px);overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.top-title.open .model-menu{display:block}
.model-menu .mm-head{
  font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  font-weight:700;padding:6px 10px 8px;
}
.model-menu .mm-item{
  width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:11px 12px;border-radius:12px;border:1px solid transparent;
  background:transparent;color:var(--text);text-align:left;cursor:pointer;
}
.model-menu .mm-item:active{background:rgba(255,255,255,.06)}
.model-menu .mm-item.active{
  background:rgba(94,200,255,.12);border-color:rgba(94,200,255,.35);
}
.model-menu .mm-item b{font-size:14px;font-weight:700}
.model-menu .mm-item span{font-size:11px;color:var(--muted);line-height:1.3}
.model-menu .mm-item.active b{color:var(--accent)}

.finn-avatar{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;transition:transform .2s;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 0 20px rgba(94,200,255,.15), inset 0 0 12px rgba(255,255,255,.05);
  animation:finnBob 3.6s ease-in-out infinite;
}
.finn-avatar:active{transform:scale(.92)}
.finn-avatar svg{width:38px;height:38px;position:relative;z-index:1}
.finn-avatar::before{
  content:'';position:absolute;inset:-3px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(94,200,255,0) 0%,rgba(94,200,255,.65) 14%,rgba(94,200,255,0) 30%);
  animation:finnRingSpin 3.4s linear infinite;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  opacity:.85;
}
@keyframes finnRingSpin{to{transform:rotate(360deg)}}
@keyframes finnBob{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-3px) scale(1.03)}
}
.finn-avatar[data-emotion="angry"]::before{background:conic-gradient(from 0deg,rgba(248,113,113,0) 0%,rgba(248,113,113,.75) 14%,rgba(248,113,113,0) 30%)}
.finn-avatar.finn-shake{animation:finnShake .42s ease}
@keyframes finnShake{
  0%,100%{transform:translateX(0) rotate(0)}
  15%{transform:translateX(-3px) rotate(-6deg)}
  30%{transform:translateX(3px) rotate(6deg)}
  45%{transform:translateX(-3px) rotate(-4deg)}
  60%{transform:translateX(3px) rotate(4deg)}
  75%{transform:translateX(-1.5px) rotate(-2deg)}
}
.finn-brow{transition:opacity .18s,transform .18s}
.finn-avatar .finn-tip{animation:finnTipPulse 1.8s ease-in-out infinite}
@keyframes finnTipPulse{0%,100%{opacity:.7;r:2.1px}50%{opacity:1;r:2.6px}}
.finn-mini-face{display:inline-flex;width:22px;height:22px;flex-shrink:0}
.finn-mini-face svg{width:100%;height:100%}
.finn-tip-tooltip{
  position:absolute;top:50px;left:0;transform:none;
  background:var(--card2);border:1px solid var(--line);
  padding:8px 12px;border-radius:12px;font-size:12px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.finn-avatar.show-tip .finn-tip-tooltip{opacity:1}
.top-actions{display:flex;gap:6px;flex:0 0 auto;width:auto;justify-content:flex-end}
.icon-btn{
  width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  font-size:17px;
  transition:background .15s,border-color .15s;
}
.icon-btn:active{background:rgba(255,255,255,.12)}
.icon-btn.sync-ok{color:var(--green)}
.icon-btn.sync-busy{color:var(--gold);animation:spin 1.2s linear infinite}
.icon-btn.sync-err{color:var(--red)}
.icon-btn.sync-pending{color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}

.wrap{padding:12px 14px 24px;max-width:520px;margin:0 auto}

/* Glass cards */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.06);
}
.card.hero{
  background:linear-gradient(145deg,rgba(32,52,92,.78),rgba(18,28,48,.85));
  border:1px solid rgba(120,180,255,.2);
  box-shadow:0 12px 40px rgba(0,20,60,.35), inset 0 1px 0 rgba(255,255,255,.08);
  overflow:hidden;
  position:relative;
}
.card.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 20% 30%,rgba(94,200,255,.12),transparent 60%);
  pointer-events:none;
}
.card.tight{padding:14px}

/* Hero layout closer to screenshot */
.hero-main{display:flex;gap:16px;align-items:center;position:relative;z-index:1}
.orbit-wrap{position:relative;width:110px;height:110px;flex-shrink:0}
.orbit-svg{width:110px;height:110px;filter:drop-shadow(0 0 8px rgba(94,200,255,.25))}
.orbit-core{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
}
.orbit-val{font-size:22px;font-weight:800;letter-spacing:-.03em;color:#fff;text-shadow:0 0 12px rgba(94,200,255,.4)}
.orbit-sub{font-size:11px;color:var(--muted);margin-top:2px}
.hero-stats{flex:1;min-width:0}
.hero-shift{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--gold);
  background:rgba(240,192,96,.12);
  border:1px solid rgba(240,192,96,.25);
  padding:5px 12px;border-radius:999px;margin-bottom:10px;
}
.ring-legend{display:flex;flex-direction:column;gap:7px}
.ring-leg-item{
  display:flex;align-items:center;gap:8px;font-size:13px;
}
.ring-leg-item .leg-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 6px currentColor;
}
.ring-leg-item .leg-name{flex:1;color:var(--muted)}
.ring-leg-item b{font-weight:700;font-variant-numeric:tabular-nums}

/* Mini sparkline placeholder */
.spark-wrap{margin-top:10px;height:36px;opacity:.7}
.spark-wrap svg{width:100%;height:100%}

/* Calendar glass */
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month-title{font-size:16px;font-weight:700;text-align:center;flex:1;letter-spacing:-.02em}
.mnav{
  width:36px;height:36px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  font-size:20px;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.mnav:active{background:rgba(255,255,255,.14)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:4px}
.cal-h{text-align:center;font-size:11px;color:var(--muted);font-weight:500;padding-bottom:4px}
.cal-d{
  aspect-ratio:1;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:500;
  background:rgba(255,255,255,.04);
  border:1px solid transparent;
  transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;
  position:relative;
}
.cal-d:active{transform:scale(.92)}
.cal-d.today{
  border:1.5px solid var(--gold);
  background:rgba(240,192,96,.1);
  box-shadow:0 0 12px rgba(240,192,96,.25);
  font-weight:700;
}
.cal-d.other{opacity:.3}
.cal-d .dot{
  width:5px;height:5px;border-radius:50%;margin-top:3px;
  box-shadow:0 0 5px currentColor;
}
.cal-d.day .dot{background:#F0C060;color:#F0C060}
.cal-d.night .dot{background:#60A5FA;color:#60A5FA}
.cal-d.off .dot{background:#6B7A90;color:#6B7A90}
.cal-d.has-obl{box-shadow:inset 0 0 0 1.5px rgba(248,113,113,.5)}
.cal-d.selected{
  border-color:var(--accent);
  background:rgba(94,200,255,.12);
  box-shadow:0 0 14px rgba(94,200,255,.3);
}
.cal-d .star{
  position:absolute;top:2px;right:4px;font-size:8px;line-height:1;
  filter:drop-shadow(0 0 3px rgba(240,192,96,.7));
  animation:starPulse 2.4s ease-in-out infinite;
}
@keyframes starPulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}

.btn-shift{
  width:100%;margin-top:12px;padding:12px;
  border-radius:14px;font-weight:600;font-size:14px;
  background:linear-gradient(135deg,rgba(94,200,255,.15),rgba(94,200,255,.08));
  border:1px solid rgba(94,200,255,.3);
  color:var(--accent);
  box-shadow:0 4px 16px rgba(40,100,180,.2);
  transition:transform .15s,background .15s;
}
.btn-shift:active{transform:scale(.98)}

/* Quick nav cards */
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-nav{
  text-align:left;padding:14px;border-radius:16px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  transition:background .15s,border-color .15s,transform .12s;
}
.quick-nav:active{transform:scale(.97);background:rgba(255,255,255,.09)}
.quick-nav .qn-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.quick-nav b{font-size:16px;font-weight:700}

/* Sections, lists, items */
.sec{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;
}
.sec-head{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;text-align:left}
.sec-title{font-size:14px;font-weight:600;flex:1}
.sec-right{font-size:13px;color:var(--muted);font-weight:600}
.sec-chev{font-size:16px;color:var(--muted);transform:rotate(90deg);transition:transform .2s}
.sec.open .sec-chev{transform:rotate(-90deg)}
.sec-body{display:none;padding:0 12px 12px}
.sec.open .sec-body{display:block}
.list{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:rgba(255,255,255,.04);
  border-radius:14px;border:1px solid var(--line);
  transition:background .15s;
}
.item:active{background:rgba(255,255,255,.08)}
.item .left{display:flex;flex-direction:column;font-size:13px;gap:2px}
.item .amt{font-weight:700;font-size:14px}
.plus,.amt.plus{color:var(--green)}.minus,.amt.minus,.neg{color:var(--red)}
.empty.tight{padding:16px;text-align:center;color:var(--muted);font-size:13px}
.hint{margin-top:10px;font-size:12px;color:var(--muted);padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--line)}

/* Bottom nav glass */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:space-around;align-items:center;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(9,14,25,.96);
  border-top:1px solid var(--line);
  box-shadow:0 -8px 32px rgba(0,0,0,.3);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:6px 4px;font-size:10px;color:var(--muted);
  transition:color .15s;
}
.bn-item.active{color:var(--accent)}
.bn-item.active .bn-ic{background:rgba(94,200,255,.15);border-color:rgba(94,200,255,.3)}
.bn-item .bn-ic{
  width:36px;height:28px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;transition:background .15s,border-color .15s;
}
.bn-item .bn-ic svg{width:22px;height:22px}
body.has-bnav{padding-bottom:calc(var(--nav-h) + 20px + var(--safe-b))}

/* FAB — position only via .fab-wrap */
.fab{
  position:relative;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(145deg,#5EC8FF,#3A8FE8);
  color:#0A101C;font-size:28px;font-weight:300;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 24px rgba(60,140,220,.5),0 0 0 3px rgba(94,200,255,.45);
  transition:transform .15s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
  isolation:isolate;
}
.fab::after{
  content:"";position:absolute;inset:-3px;border-radius:50%;
  border:2px solid rgba(94,200,255,.55);
  opacity:.6;transform:scale(1);
  will-change:transform,opacity;
  animation:fabRing 2.4s ease-out infinite;
  pointer-events:none;
}
.fab:active{transform:scale(.92)}
.fab.holding{
  transform:scale(.9);
  box-shadow:0 0 0 6px rgba(94,200,255,.25),0 8px 24px rgba(58,143,232,.55)!important;
}
.fab.open{transform:rotate(45deg)}
.fab.open::after{animation:fabRingFast .9s ease-out infinite;border-color:rgba(94,200,255,.9)}
@keyframes fabRing{
  0%{transform:scale(1);opacity:.55}
  70%{transform:scale(1.35);opacity:0}
  100%{transform:scale(1.35);opacity:0}
}
@keyframes fabRingFast{
  0%{transform:scale(1);opacity:.7}
  100%{transform:scale(1.5);opacity:0}
}

/* Misc */
.view-header{display:flex;align-items:center;gap:12px;padding:2px 0 16px}
.view-header .back-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
}
.view-header h2{font-size:18px;font-weight:700;flex:1}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 30px + var(--safe-b));
  transform:translateX(-50%) translateY(20px);opacity:0;
  background:rgba(18,27,46,.98);
  border:1px solid var(--line);padding:10px 18px;border-radius:14px;
  font-size:13px;z-index:100;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:0 8px 28px rgba(0,0,0,.4);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--muted);font-size:12px}
.big{font-size:26px;font-weight:700}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;font-weight:600}

.fab-wrap{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);z-index:45;width:56px;height:56px}
.radial{
  position:absolute;right:0;bottom:68px;
  display:flex;flex-direction:column;gap:8px;
  background:rgba(12,20,38,.98);
  border:1px solid var(--line);border-radius:18px;padding:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.45);min-width:160px;
  opacity:0;pointer-events:none;transform-origin:bottom right;
  transform:translate3d(0,8px,0) scale(.92);
  transition:opacity .16s ease-out,transform .16s ease-out;
  will-change:transform,opacity;
}
.radial.show{opacity:1;pointer-events:auto;transform:translate3d(0,0,0) scale(1)}
.radial button{
  display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-radius:12px;font-size:14px;font-weight:500;
  background:rgba(255,255,255,.04);border:1px solid transparent;
  transition:background .15s;
}
.radial button:active{background:rgba(255,255,255,.1)}
.radial .ic{font-size:16px}.radial button.matter-act{border-top:1px solid rgba(255,255,255,.08);margin-top:4px;color:#C4D4FF}
.modal-bg{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;
  transition:opacity .2s;
  will-change:opacity;
}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{
  position:fixed;left:50%;top:50%;transform:translate3d(-50%,-50%,0) scale(.95);
  z-index:70;width:min(360px,92vw);max-height:80vh;overflow:auto;
  background:rgba(13,21,39,.99);
  border:1px solid var(--line);border-radius:22px;padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
  will-change:transform,opacity;
  contain:content;
}
.modal.show{opacity:1;pointer-events:auto;transform:translate3d(-50%,-50%,0) scale(1)}
.modal h3{font-size:17px;font-weight:700;margin-bottom:14px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal input,.modal select,.modal textarea{
  width:100%;padding:11px 12px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  color:var(--text);font-size:15px;
}
.modal .row{display:flex;gap:10px;margin-top:16px}
.modal .btn{
  flex:1;padding:12px;border-radius:14px;font-weight:600;font-size:14px;
  background:rgba(94,200,255,.15);border:1px solid rgba(94,200,255,.3);color:var(--accent);
}
.modal .btn.primary{background:linear-gradient(135deg,#5EC8FF,#3A8FE8);color:#0A101C;border:none}
.modal .btn.danger{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.3);color:var(--red)}

/* Finn avatar aura pulse */
.finn-aura{
  position:absolute;inset:-4px;border-radius:50%;
  border:2px solid rgba(74,222,128,.45);
  opacity:0;pointer-events:none;
  will-change:transform,opacity;
  animation:finnAuraPulse 2.6s ease-in-out infinite;
}
.finn-avatar.status-green .finn-aura{border-color:rgba(74,222,128,.55)}
.finn-avatar.status-orange .finn-aura{border-color:rgba(251,191,36,.55)}

<script>
(function(){
  function syncNav(){
    var v = (window.currentView || (typeof currentView!=='undefined'?currentView:'home')) || 'home';
    // currentView is local to app.js closure, so use data attribute or global
    document.querySelectorAll('#bottomNav .bn-item').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-view') === (window.__finView||'home'));
    });
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('#bottomNav .bn-item');
    if(!b) return;
    e.preventDefault();
    var v = b.getAttribute('data-view') || 'home';
    window.__finView = v;
    if(typeof goView === 'function') goView(v);
    else if(typeof goHome === 'function' && v==='home') goHome();
    document.querySelectorAll('#bottomNav .bn-item').forEach(function(x){x.classList.toggle('active', x===b);});
  });
  // swipe right to go back
  var sx=0, sy=0;
  document.addEventListener('touchstart', function(e){ if(e.touches[0]){sx=e.touches[0].clientX;sy=e.touches[0].clientY;} }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!e.changedTouches[0]) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if(dx > 80 && Math.abs(dy) < 60){
      if(window.__finView && window.__finView !== 'home' && typeof goHome === 'function'){
        window.__finView = 'home';
        goHome();
        document.querySelectorAll('#bottomNav .bn-item').forEach(function(x){x.classList.toggle('active', x.getAttribute('data-view')==='home');});
      }
    }
  }, {passive:true});
})();
</script>

<script>
(function(){
  var lastY=0;
  document.addEventListener('touchstart', function(e){
    if(e.touches[0]) lastY=e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    var t=e.target;
    if(!t || !t.closest) return;
    // Full-screen settings / modals: never let the page underneath move
    if(t.closest('.modal-bg.show.full') || t.closest('.modal-bg.full.show')){
      var sc=t.closest('.modal-scroll');
      if(!sc){ e.preventDefault(); return; }
      var y=e.touches[0]?e.touches[0].clientY:lastY;
      var dy=y-lastY;
      lastY=y;
      var top=sc.scrollTop<=0;
      var bot=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2;
      if((top && dy>0) || (bot && dy<0) || (top && bot)){ e.preventDefault(); }
      return;
    }
    if(t.closest('.modal-bg.show') || t.closest('#dlgLayer') || t.closest('.ka-bg') || t.closest('#finTour') || t.closest('.modal-card') || t.closest('.ka-chat')){
      var sc2=t.closest('.modal-scroll, .modal-card, .ka-chat, .ka-card');
      if(sc2){
        var y2=e.touches[0]?e.touches[0].clientY:lastY;
        var dy2=y2-lastY;
        lastY=y2;
        if((sc2.scrollTop<=0 && dy2>0) || (sc2.scrollTop+sc2.clientHeight>=sc2.scrollHeight-1 && dy2<0)){
          e.preventDefault();
        }
      } else {
        e.preventDefault();
      }
    }
  }, {passive:false});
})();
</script>

<script>
(function(){
  function meta(id){
    try{if(window.kopeykaAI&&window.kopeykaAI.modelMeta)return window.kopeykaAI.modelMeta(id);}catch(e){}
    return {id:id||'',title:'Модель',sub:''};
  }
  function current(){
    try{if(window.kopeykaAI&&window.kopeykaAI.getModel)return window.kopeykaAI.getModel();}catch(e){}
    try{return localStorage.getItem('finna_groq_model')||'openai/gpt-oss-120b';}catch(e){return 'openai/gpt-oss-120b';}
  }
  function label(){
    var el=document.getElementById('finModelLabel');
    if(!el)return;
    var m=meta(current());
    var auto=true;
    try{if(window.kopeykaAI&&window.kopeykaAI.isAutoModelEnabled)auto=window.kopeykaAI.isAutoModelEnabled();}catch(e){}
    el.textContent=(m.title||'Модель')+(auto?' · авто':'');
  }
  function closeMenu(){
    var t=document.getElementById('finTitle');
    if(t)t.classList.remove('open');
    var m=document.getElementById('finModelMenu');
    if(m)m.setAttribute('aria-hidden','true');
  }
  function renderList(){
    var box=document.getElementById('finModelList');
    if(!box)return;
    var list=[];
    try{if(window.kopeykaAI&&window.kopeykaAI.listModels)list=window.kopeykaAI.listModels();}catch(e){}
    if(!list||!list.length){
      list=[
        {id:'openai/gpt-oss-120b',title:'Умная',sub:'GPT-OSS 120B · глубже думает'},
        {id:'llama-3.3-70b-versatile',title:'Универсал',sub:'Llama 3.3 70B · баланс качества'},
        {id:'qwen/qwen3-32b',title:'Альтернатива',sub:'Qwen 3 32B · другой стиль'},
        {id:'openai/gpt-oss-20b',title:'Быстрая',sub:'GPT-OSS 20B · мгновенные ответы'},
        {id:'llama-3.1-8b-instant',title:'Молния',sub:'Llama 3.1 8B · самая быстрая'}
      ];
    }
    var cur=current();
    box.innerHTML='';
    function statusHtml(m){
      var st={level:'unknown',label:'проверка…'};
      try{if(window.kopeykaAI&&window.kopeykaAI.getModelStatus)st=window.kopeykaAI.getModelStatus(m.id)||st;}catch(e){}
      return '<div class="mm-status"><i class="mm-dot '+(st.level||'unknown')+'"></i><span>'+(st.label||'')+'</span></div>';
    }
    // пункт авто
    (function(){
      var autoOn=true;
      try{if(window.kopeykaAI&&window.kopeykaAI.isAutoModelEnabled)autoOn=window.kopeykaAI.isAutoModelEnabled();}catch(e){}
      var ab=document.createElement('button');
      ab.type='button';
      ab.className='mm-item'+(autoOn?' active':'');
      ab.innerHTML='<b>Автовыбор</b><span>Сам берёт самую умную из доступных</span>';
      ab.onclick=function(e){
        e.preventDefault();e.stopPropagation();
        try{
          if(window.kopeykaAI){
            if(window.kopeykaAI.setAutoModelEnabled)window.kopeykaAI.setAutoModelEnabled(true);
            if(window.kopeykaAI.autoSelectBestModel){
              window.kopeykaAI.autoSelectBestModel(true).then(function(){label();renderList();});
            }
          }
        }catch(x){}
        try{if(window.toast)window.toast('Автовыбор модели включён');}catch(x){}
      };
      box.appendChild(ab);
    })();
    list.forEach(function(m){
      var b=document.createElement('button');
      b.type='button';
      b.className='mm-item'+(m.id===cur?' active':'');
      b.innerHTML='<b>'+m.title+'</b><span>'+m.sub+'</span>'+statusHtml(m);
      b.onclick=function(e){
        e.preventDefault();e.stopPropagation();
        try{
          if(window.kopeykaAI&&window.kopeykaAI.setModel)window.kopeykaAI.setModel(m.id,{manual:true});
          else localStorage.setItem('finna_groq_model',m.id);
        }catch(x){}
        label();
        closeMenu();
        try{if(window.toast)window.toast('Модель: '+m.title+' (вручную)');}catch(x){}
      };
      box.appendChild(b);
    });
    try{
      if(window.kopeykaAI&&window.kopeykaAI.probeModelStatuses){
        window.kopeykaAI.probeModelStatuses(false).then(function(){
          if(!document.getElementById('finTitle')||!document.getElementById('finTitle').classList.contains('open'))return;
          var again=document.getElementById('finModelList');
          if(!again)return;
          // обновить только статус-строки у моделей (после пункта Авто)
          var buttons=again.querySelectorAll('.mm-item');
          var offset=1; // первый — Автовыбор
          list.forEach(function(m,i){
            var btn=buttons[i+offset];if(!btn)return;
            var st=btn.querySelector('.mm-status');
            if(st)st.outerHTML=statusHtml(m);
          });
        });
      }
    }catch(e){}
  }
  function toggle(e){
    if(e){e.preventDefault();e.stopPropagation();}
    var t=document.getElementById('finTitle');
    if(!t)return;
    var open=t.classList.contains('open');
    if(open){closeMenu();return;}
    renderList();
    t.classList.add('open');
    var m=document.getElementById('finModelMenu');
    if(m)m.setAttribute('aria-hidden','false');
  }
  function boot(){
    label();
    var t=document.getElementById('finTitle');
    if(t&&!t._bound){
      t._bound=true;
      t.addEventListener('click',function(e){
        if(e.target.closest&&e.target.closest('.model-menu'))return;
        toggle(e);
      });
    }
    document.addEventListener('click',function(e){
      var t=document.getElementById('finTitle');
      if(!t||!t.classList.contains('open'))return;
      if(t.contains(e.target))return;
      closeMenu();
    });
    window.__finnaModelChanged=function(){label();};
    // автовыбор лучшей доступной при старте
    setTimeout(function(){
      try{
        if(window.kopeykaAI&&window.kopeykaAI.autoSelectBestModel){
          window.kopeykaAI.autoSelectBestModel(false).then(function(){label();});
        }
      }catch(e){}
    },600);
    // периодически (раз в 5 мин) подстраховаться
    setInterval(function(){
      try{
        if(window.kopeykaAI&&window.kopeykaAI.autoSelectBestModel){
          window.kopeykaAI.autoSelectBestModel(false).then(function(){label();});
        }
      }catch(e){}
    },5*60*1000);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(boot,80);});
  else setTimeout(boot,80);
  setTimeout(label,400);
  setTimeout(label,1200);
})();
</script>
