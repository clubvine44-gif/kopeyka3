<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Финна · виджет</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Roboto,sans-serif;background:#0A0B0E;color:#F2F3F7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:320px;background:#16181F;border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#9AA0B0;font-weight:600}
.big{font-size:28px;font-weight:700;margin:6px 0 4px;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.row div{text-align:center;flex:1}
.row b{display:block;font-size:15px}
.row span{font-size:11px;color:#9AA0B0}
.mic{width:100%;margin-top:16px;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#F0C384,#E5A75E);color:#1A1208;font-weight:700;font-size:16px;cursor:pointer}
.muted{font-size:12px;color:#9AA0B0;margin-top:10px;line-height:1.4;text-align:center}
a.open{display:block;text-align:center;margin-top:10px;color:#E5A75E;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="label">Финна · сейчас</div>
  <div class="big" id="cash">—</div>
  <div class="label" id="sub">Касса</div>
  <div class="row">
    <div><b id="inc">—</b><span>доходы</span></div>
    <div><b id="exp">—</b><span>расходы</span></div>
    <div><b id="res">—</b><span>резервы</span></div>
  </div>
  <button class="mic" id="mic" type="button">🎙️ Голос</button>
  <a class="open" href="./">Открыть приложение</a>
  <p class="muted">Добавь эту страницу на рабочий стол — получится быстрый виджет. Данные берутся из того же хранилища, что и в Финне.</p>
</div>
<script src="secure-store.js?v=2026091501"></script>
<script>
(function(){
  function fmt(n){n=Math.round(+n||0);return (n<0?'−':'')+Math.abs(n).toLocaleString('ru-RU')+' ₽';}
  function monthOf(d){return String(d||'').slice(0,7);}
  function alive(x){return !!(x&&!x.deleted);}
  function nextMonth(ym){var p=String(ym||'').split('-').map(Number);if(p.length<2||!p[0]||!p[1])return ym;var y=p[0],m=p[1]+1;if(m>12){m=1;y++;}return y+'-'+String(m).padStart(2,'0');}
  function monthDelta(st,m){
    var inc=0,exp=0,dep=0,wd=0;
    (st.income||[]).forEach(function(i){if(!alive(i))return;if(monthOf(i.date)===m)inc+=Number(i.amount||0);});
    (st.expenses||[]).forEach(function(e){if(!alive(e))return;if(monthOf(e.date)===m)exp+=Number(e.amount||0);});
    (st.reserveOps||[]).forEach(function(o){if(!alive(o))return;if(monthOf(o.date)!==m)return;var a=Number(o.amount||0);if(o.type==='deposit')dep+=a;else wd+=a;});
    return {inc:inc,exp:exp,dep:dep,wd:wd,delta:inc-exp-dep+wd};
  }
  function openingFor(st, target){
    var anchor=(st.settings&&st.settings.month)||target;
    var open=Number(st.settings&&st.settings.openingBalance||0);
    target=String(target||anchor);
    if(target===anchor)return open;
    if(target>anchor){
      var m=anchor,guard=0;
      while(m!==target&&guard++<240){open+=monthDelta(st,m).delta;m=nextMonth(m);}
      return open;
    }
    var prevMonth=function(ym){var p=String(ym||'').split('-').map(Number);if(p.length<2||!p[0]||!p[1])return ym;var y=p[0],m=p[1]-1;if(m<1){m=12;y--;}return y+'-'+String(m).padStart(2,'0');};
    var m2=anchor,guard2=0;
    while(m2!==target&&guard2++<240){m2=prevMonth(m2);open-=monthDelta(st,m2).delta;}
    return open;
  }
  function apply(st){
    if(!st){document.getElementById('cash').textContent='Нет данных';return;}
    var now=new Date();
    var month=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    var ops=monthDelta(st,month);
    var open=openingFor(st,month);
    var cash=open+ops.delta;
    var resT=0;(st.reserves||[]).forEach(function(r){if(!alive(r))return;resT+=Number(r.saved||0);});
    document.getElementById('cash').textContent=fmt(cash);
    document.getElementById('inc').textContent='+'+fmt(ops.inc);
    document.getElementById('exp').textContent='−'+fmt(ops.exp);
    document.getElementById('res').textContent=fmt(resT);
    document.getElementById('sub').textContent='Касса';
  }
  function locked(){
    document.getElementById('cash').textContent='Открой Финну';
    document.getElementById('sub').textContent='Данные зашифрованы';
  }
  function refresh(){
    try{
      var raw=localStorage.getItem('kopeyka3_state_v1');
      if(!raw){
        try{raw=localStorage.getItem('kopeyka3_state_v1__raw_backup');}catch(e2){}
      }
      if(!raw){apply(null);return;}
      if(String(raw).indexOf('FINENC1:')===0){
        if(window.FinSecureStore&&typeof window.FinSecureStore.loadState==='function'){
          window.FinSecureStore.loadState('kopeyka3_state_v1',function(){return null;},function(x){return x;}).then(function(st){
            if(st)apply(st);else locked();
          }).catch(locked);
          return;
        }
        locked();
        return;
      }
      apply(JSON.parse(raw));
    }catch(e){apply(null);}
  }
  document.getElementById('mic').onclick=function(){location.href='./?voice=1';};
  refresh();
  setInterval(refresh,4000);
})();
</script>
</body>
</html>
